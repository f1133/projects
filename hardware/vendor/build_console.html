const WC={pwr:'#C0392B',gnd:'#2C2E33',sig:'#1B4B8F',ana:'#7D3C98',phase:'#B0703A',
          can:'#128A6B',v3:'#E67E22',clk:'#5A6170'};

/* every builder returns {s: svg string, P:{pinName:[x,y]}} */
function bSOIC(x,y,name,pins,sub){   // pins: 8 names, index 0 = pin 1
  const w=92,h=118,ps=(h-30)/3;
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#2C2E33" stroke="#15171B" stroke-width="1.4"/>`;
  s+=`<circle cx="${x+13}" cy="${y+13}" r="4.5" fill="none" stroke="#EFEEE9" stroke-width="1.4"/>`;
  s+=`<path d="M${x+w/2-11} ${y} a11 11 0 0 0 22 0" fill="none" stroke="#EFEEE9" stroke-width="1.3"/>`;
  s+=`<text x="${x+w/2}" y="${y+h/2}" text-anchor="middle" font-size="10.5" font-weight="600" fill="#EFEEE9">${esc(name)}</text>`;
  if(sub) s+=`<text x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle" font-size="8.5" fill="#9BA1AC">${esc(sub)}</text>`;
  const P={};
  for(let i=0;i<4;i++){ const py=y+15+ps*i;
    s+=`<rect x="${x-11}" y="${py-3}" width="11" height="6" fill="#B0703A"/>`;
    s+=`<text x="${x-15}" y="${py-5}" text-anchor="end" font-size="8.5" fill="#5A6170">${i+1}</text>`;
    s+=`<text x="${x-15}" y="${py+5}" text-anchor="end" font-size="9.5" font-weight="600" fill="#15171B">${esc(pins[i])}</text>`;
    P[pins[i]]=[x-11,py]; P['p'+(i+1)]=[x-11,py]; }
  for(let i=0;i<4;i++){ const py=y+h-15-ps*i, n=5+i;
    s+=`<rect x="${x+w}" y="${py-3}" width="11" height="6" fill="#B0703A"/>`;
    s+=`<text x="${x+w+15}" y="${py-5}" font-size="8.5" fill="#5A6170">${n}</text>`;
    s+=`<text x="${x+w+15}" y="${py+5}" font-size="9.5" font-weight="600" fill="#15171B">${esc(pins[n-1])}</text>`;
    P[pins[n-1]]=[x+w+11,py]; P['p'+n]=[x+w+11,py]; }
  return {s,P};
}
function bMCU(x,y,w,h,name,sides){   // sides:{L:[[pin,label]],R:[],T:[],B:[]}
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#2C2E33" stroke="#15171B" stroke-width="1.5"/>`;
  s+=`<circle cx="${x+14}" cy="${y+14}" r="5.5" fill="none" stroke="#EFEEE9" stroke-width="1.5"/>`;
  s+=`<text x="${x+w/2}" y="${y+h/2-3}" text-anchor="middle" font-size="12" font-weight="600" fill="#EFEEE9">${esc(name)}</text>`;
  s+=`<text x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle" font-size="9" fill="#9BA1AC">LQFP-48 · dot top left</text>`;
  const P={};
  const put=(arr,side)=>{ if(!arr) return;
    const n=arr.length;
    arr.forEach((pr,i)=>{
      const t=(i+1)/(n+1);
      let px,py,tx,ty,anc;
      if(side==='L'){px=x-12;py=y+h*t;tx=x-16;ty=py;anc='end';s+=`<rect x="${x-12}" y="${py-3}" width="12" height="6" fill="#B0703A"/>`;}
      if(side==='R'){px=x+w+12;py=y+h*t;tx=x+w+16;ty=py;anc='start';s+=`<rect x="${x+w}" y="${py-3}" width="12" height="6" fill="#B0703A"/>`;}
      if(side==='T'){px=x+w*t;py=y-12;tx=px;ty=y-18;anc='middle';s+=`<rect x="${px-3}" y="${y-12}" width="6" height="12" fill="#B0703A"/>`;}
      if(side==='B'){px=x+w*t;py=y+h+12;tx=px;ty=y+h+26;anc='middle';s+=`<rect x="${px-3}" y="${y+h}" width="6" height="12" fill="#B0703A"/>`;}
      s+=`<text x="${tx}" y="${ty+(side==='T'?0:(side==='B'?0:-4))}" text-anchor="${anc}" font-size="8.5" fill="#5A6170">pin ${pr[0]}</text>`;
      s+=`<text x="${tx}" y="${ty+(side==='T'?-10:(side==='B'?12:6))}" text-anchor="${anc}" font-size="9.5" font-weight="600" fill="#15171B">${esc(pr[1])}</text>`;
      P[pr[1]]=[px,py];
    });};
  put(sides.L,'L');put(sides.R,'R');put(sides.T,'T');put(sides.B,'B');
  return {s,P};
}
function bMod(x,y,w,h,name,sub,left,right,col){  // left/right arrays of pad names
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${col||'#1F3A2E'}" stroke="#15171B" stroke-width="1.4"/>`;
  s+=`<text x="${x+w/2}" y="${y+h/2-2}" text-anchor="middle" font-size="11" font-weight="600" fill="#DCE6E0">${esc(name)}</text>`;
  if(sub) s+=`<text x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle" font-size="8.5" fill="#9BB0A4">${esc(sub)}</text>`;
  const P={};
  const put=(arr,side)=>{ if(!arr) return; const n=arr.length;
    arr.forEach((nm,i)=>{ const t=(i+1)/(n+1), py=y+h*t;
      if(side==='L'){ s+=`<rect x="${x-9}" y="${py-4}" width="9" height="8" fill="#B0703A"/>`;
        s+=`<text x="${x-13}" y="${py+3.5}" text-anchor="end" font-size="9.5" font-weight="600" fill="#15171B">${esc(nm)}</text>`;
        P[nm]=[x-9,py]; }
      else { s+=`<rect x="${x+w}" y="${py-4}" width="9" height="8" fill="#B0703A"/>`;
        s+=`<text x="${x+w+13}" y="${py+3.5}" font-size="9.5" font-weight="600" fill="#15171B">${esc(nm)}</text>`;
        P[nm]=[x+w+9,py]; }});};
  put(left,'L');put(right,'R');
  return {s,P};
}
function bConn(x,y,n,name,labels,horiz){
  const pw=24, w=horiz?n*pw+14:44, h=horiz?46:n*20+14;
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#EFEEE9" stroke="#15171B" stroke-width="1.5"/>`;
  s+=`<text x="${x+w/2}" y="${y-7}" text-anchor="middle" font-size="9.5" fill="#5A6170">${esc(name)}</text>`;
  const P={};
  for(let i=0;i<n;i++){
    if(horiz){ const cx=x+7+pw*i+pw/2;
      s+=`<rect x="${cx-4}" y="${y+8}" width="8" height="${h-16}" fill="#B0703A"/>`;
      s+=`<text x="${cx}" y="${y+h+13}" text-anchor="middle" font-size="8.5" fill="${i?'#5A6170':'#A32D2D'}">${i+1}</text>`;
      s+=`<text x="${cx}" y="${y+h+25}" text-anchor="middle" font-size="9" font-weight="600" fill="#15171B">${esc(labels[i])}</text>`;
      P[labels[i]]=[cx,y]; }
    else { const cy=y+7+20*i+10;
      s+=`<rect x="${x+8}" y="${cy-4}" width="${w-16}" height="8" fill="#B0703A"/>`;
      s+=`<text x="${x+w+8}" y="${cy+3.5}" font-size="9" font-weight="600" fill="#15171B">${i+1} ${esc(labels[i])}</text>`;
      P[labels[i]]=[x,cy]; }}
  return {s,P};
}
function bPass(x,y,kind,val,horiz){
  let s='',P={};
  if(kind==='r'){
    if(horiz){ s=`<rect x="${x}" y="${y-8}" width="44" height="16" fill="#EFEEE9" stroke="#15171B" stroke-width="1.3"/>`
      +`<text x="${x+22}" y="${y-13}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1B4B8F">${esc(val)}</text>`;
      P.a=[x,y];P.b=[x+44,y];}
    else { s=`<rect x="${x-8}" y="${y}" width="16" height="44" fill="#EFEEE9" stroke="#15171B" stroke-width="1.3"/>`
      +`<text x="${x+13}" y="${y+26}" font-size="9.5" font-weight="600" fill="#1B4B8F">${esc(val)}</text>`;
      P.a=[x,y];P.b=[x,y+44];}
  }
  if(kind==='c'){ s=`<path d="M${x} ${y} v10 M${x-11} ${y+10} h22 M${x-11} ${y+18} h22 M${x} ${y+18} v10" stroke="#15171B" stroke-width="1.6" fill="none"/>`
    +`<text x="${x+15}" y="${y+16}" font-size="9.5" font-weight="600" fill="#1B4B8F">${esc(val)}</text>`;
    P.a=[x,y];P.b=[x,y+28];}
  if(kind==='xtal'){ s=`<rect x="${x-26}" y="${y-16}" width="52" height="32" rx="4" fill="#C9C7C0" stroke="#15171B" stroke-width="1.4"/>`
    +`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#15171B">${esc(val)}</text>`;
    P.a=[x-26,y];P.b=[x+26,y];}
  if(kind==='led'){ s=`<path d="M${x} ${y} v8 M${x-9} ${y+8} h18 l-9 12 z M${x-9} ${y+20} h18 M${x} ${y+20} v8" stroke="#15171B" stroke-width="1.5" fill="#C64A3A"/>`
    +`<text x="${x+14}" y="${y+18}" font-size="9" fill="#5A6170">${esc(val)}</text>`;
    P.a=[x,y];P.b=[x,y+28];}
  return {s,P};
}
function bGnd(x,y){ return `<path d="M${x} ${y} v8 M${x-9} ${y+8} h18 M${x-6} ${y+12} h12 M${x-3} ${y+16} h6" stroke="#2C2E33" stroke-width="1.7" fill="none"/>`; }
function bRail(x,y,t,c){ return `<path d="M${x} ${y} v-9 M${x-7} ${y-9} l7 -7 l7 7 z" stroke="${c}" fill="${c}" stroke-width="1.4"/>`
  +`<text x="${x}" y="${y-22}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${c}">${esc(t)}</text>`; }
/* wire from A to B with optional midpoint routing */
function wr(a,b,c,mode){
  const col=WC[c]||c||'#1B4B8F';
  let d;
  if(mode==='h'){ const mx=(a[0]+b[0])/2; d=`M${a[0]} ${a[1]} H${mx} V${b[1]} H${b[0]}`; }
  else if(mode==='v'){ const my=(a[1]+b[1])/2; d=`M${a[0]} ${a[1]} V${my} H${b[0]} V${b[1]}`; }
  else d=`M${a[0]} ${a[1]} L${b[0]} ${b[1]}`;
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>`
   +`<circle cx="${a[0]}" cy="${a[1]}" r="2.6" fill="${col}"/><circle cx="${b[0]}" cy="${b[1]}" r="2.6" fill="${col}"/>`;
}

/* =====================================================================
   MECHANISM SIMULATOR
   ===================================================================== */
let SIM={run:false,theta:0,rpm:60,raf:null,j:[20,-35,60],pay:85,link:150};

function cycPoint(phi,N,R,r,e){
  const psi=Math.atan2(Math.sin((1-N)*phi),(R/(e*N))-Math.cos((1-N)*phi));
  return [ R*Math.cos(phi)-r*Math.cos(phi+psi)-e*Math.cos(N*phi),
          -R*Math.sin(phi)+r*Math.sin(phi+psi)+e*Math.sin(N*phi) ];
}
function cycPath(N,R,r,e,ox,oy,k){
  let d='';
  for(let i=0;i<=180;i++){
    const p=cycPoint(i/180*2*Math.PI,N,R,r,e);
    d+=(i?'L':'M')+(ox+p[0]*k).toFixed(2)+' '+(oy+p[1]*k).toFixed(2)+' ';
  }
  return d+'Z';
}
function drawGearSim(){
  const el=document.getElementById('simGear'); if(!el) return;
  const N=16,R=19,r=1.5,e=1.0,k=4.6,ox=200,oy=200;
  const th=SIM.theta, ratio=N-1;
  const ex=Math.cos(th)*e*k, ey=-Math.sin(th)*e*k;      // cam eccentric position
  const dr=-th/ratio;                                    // disc rotates slowly backwards
  let o='';
  o+=`<circle cx="${ox}" cy="${oy}" r="${(R+r+1.5)*k}" fill="#F1EFE8" stroke="#C9C7C0" stroke-width="2"/>`;
  // disc
  o+=`<g transform="translate(${ox+ex} ${oy+ey}) rotate(${-dr*180/Math.PI})">
        <path d="${cycPath(N,R,r,e,0,0,k)}" fill="#97C459" stroke="#2C6A4E" stroke-width="1.6"/>`;
  for(let i=0;i<6;i++){const a=i/6*2*Math.PI;
    o+=`<circle cx="${Math.cos(a)*15*k}" cy="${Math.sin(a)*15*k}" r="${2.6*k}" fill="#F1EFE8" stroke="#2C6A4E" stroke-width="1.2"/>`;}
  o+=`</g>`;
  // ring pins
  for(let i=0;i<N;i++){const a=i/N*2*Math.PI;
    o+=`<circle cx="${ox+Math.cos(a)*R*k}" cy="${oy+Math.sin(a)*R*k}" r="${r*k}" fill="#8A8F9A" stroke="#15171B" stroke-width="1"/>`;}
  // output pins follow the disc holes but stay on their own circle
  for(let i=0;i<6;i++){const a=i/6*2*Math.PI-dr;
    o+=`<circle cx="${ox+Math.cos(a)*15*k}" cy="${oy+Math.sin(a)*15*k}" r="${1.5*k}" fill="#9B59B6" stroke="#15171B" stroke-width="1"/>`;}
  // cam
  o+=`<circle cx="${ox+ex}" cy="${oy+ey}" r="${4*k}" fill="#3E7ACB" stroke="#15171B" stroke-width="1.2"/>`;
  o+=`<circle cx="${ox}" cy="${oy}" r="4" fill="#15171B"/>`;
  o+=`<line x1="${ox}" y1="${oy}" x2="${ox+Math.cos(th)*70}" y2="${oy-Math.sin(th)*70}" stroke="#A32D2D" stroke-width="2"/>`;
  o+=`<line x1="${ox}" y1="${oy}" x2="${ox+Math.cos(-dr)*104}" y2="${oy+Math.sin(-dr)*104}" stroke="#9B59B6" stroke-width="2.5"/>`;
  el.innerHTML=o;
  const inTurns=th/(2*Math.PI), outTurns=inTurns/ratio;
  const rd=document.getElementById('simGearRead');
  if(rd) rd.innerHTML=`<b class="mono">${ratio}:1</b> · input ${inTurns.toFixed(2)} turns → output ${outTurns.toFixed(3)} turns
    · output ${(SIM.rpm/ratio).toFixed(1)} rpm · torque ${(0.06*ratio*0.75).toFixed(2)} N·m`;
}
function drawArmSim(){
  const el=document.getElementById('simArm'); if(!el) return;
  const L=SIM.link, k=0.72, ox=120, oy=340;
  const a1=SIM.j[0]*Math.PI/180, a2=SIM.j[1]*Math.PI/180, a3=SIM.j[2]*Math.PI/180;
  const x1=ox+Math.cos(-a1)*L*k, y1=oy+Math.sin(-a1)*L*k;
  const x2=x1+Math.cos(-(a1+a2))*L*k, y2=y1+Math.sin(-(a1+a2))*L*k;
  const x3=x2+Math.cos(-(a1+a2+a3))*46*k, y3=y2+Math.sin(-(a1+a2+a3))*46*k;
  let o='';
  o+=`<path d="M${ox} ${oy} m${-2*L*k} 0 a${2*L*k} ${2*L*k} 0 0 1 ${4*L*k} 0" fill="none" stroke="#C9C7C0" stroke-width="1.2" stroke-dasharray="6 6"/>`;
  o+=`<line x1="20" y1="${oy}" x2="560" y2="${oy}" stroke="#C9C7C0" stroke-width="2"/>`;
  o+=`<rect x="${ox-46}" y="${oy}" width="92" height="26" rx="6" fill="#EDE7DC" stroke="#15171B" stroke-width="1.6"/>`;
  const limb=(xa,ya,xb,yb,w)=>`<line x1="${xa}" y1="${ya}" x2="${xb}" y2="${yb}" stroke="#EDE7DC" stroke-width="${w}" stroke-linecap="round"/>
     <line x1="${xa}" y1="${ya}" x2="${xb}" y2="${yb}" stroke="#B4B2A9" stroke-width="1"/>`;
  o+=limb(ox,oy,x1,y1,20)+limb(x1,y1,x2,y2,17);
  o+=`<line x1="${x2}" y1="${y2}" x2="${x3}" y2="${y3}" stroke="#EDE7DC" stroke-width="14" stroke-linecap="round"/>`;
  [[ox,oy,15],[x1,y1,13],[x2,y2,11]].forEach(j=>{
    o+=`<circle cx="${j[0]}" cy="${j[1]}" r="${j[2]}" fill="#888780" stroke="#5A6170" stroke-width="1.4"/>`;
    o+=`<circle cx="${j[0]}" cy="${j[1]}" r="${j[2]*0.4}" fill="#5F5E5A"/>`;});
  o+=`<rect x="${x3-24}" y="${y3-18}" width="48" height="36" rx="12" fill="#EDE7DC" stroke="#B4B2A9" stroke-width="1.4"/>`;
  o+=`<rect x="${x3-16}" y="${y3-11}" width="32" height="22" rx="6" fill="#1C1C22"/>`;
  o+=`<rect x="${x3-9}" y="${y3-6}" width="5" height="9" rx="2.5" fill="#5DCAA5"/>`;
  o+=`<rect x="${x3+3}" y="${y3-6}" width="5" height="9" rx="2.5" fill="#5DCAA5"/>`;
  const reach=Math.hypot(x3-ox,y3-oy)/k;
  o+=`<line x1="${ox}" y1="${oy}" x2="${x3}" y2="${y3}" stroke="#1C58A8" stroke-width="1" stroke-dasharray="4 4"/>`;
  o+=`<text x="${(ox+x3)/2}" y="${(oy+y3)/2-8}" font-size="11" fill="#1C58A8" font-weight="600">${Math.round(reach)} mm</text>`;
  el.innerHTML=o;
  // torque
  const Lm=SIM.link/1000, head=SIM.pay/1000;
  const c1=Math.cos(a1), c12=Math.cos(a1+a2);
  const tShoulder=9.81*Math.abs(Lm*c1*(0.110+0.0375)+ (Lm*c1+Lm*c12)*head + Lm*c1*0.0125*0.5);
  const tElbow=9.81*Math.abs(Lm*c12*(head+0.0375*0.5));
  const rd=document.getElementById('simArmRead');
  const bar=(v,lim,lab)=>{
    const pct=Math.min(100,v/lim*100), col=v>lim?'var(--gate)':(v>lim*0.8?'var(--amber)':'var(--done)');
    return `<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px">
      <span>${lab}</span><span class="mono">${v.toFixed(3)} / ${lim} N·m</span></div>
      <div style="height:8px;background:#DEDCD5;margin-top:3px"><div style="height:8px;background:${col};width:${pct}%"></div></div></div>`;};
  if(rd) rd.innerHTML=bar(tShoulder,0.7,'Shoulder')+bar(tElbow,0.7,'Elbow')
    +`<div style="font-size:12.5px;color:var(--graphite)">Reach ${Math.round(reach)} mm ·
       geared limit 0.7 N·m · direct drive would be 0.06</div>`;
}
function simTick(){
  if(SIM.run){ SIM.theta += (SIM.rpm/60)*2*Math.PI/60; drawGearSim(); }
  SIM.raf=requestAnimationFrame(simTick);
}
function renderSim(){
  const el=$('#t-sim');
  el.innerHTML=`
  <div class="panel"><h3>Cycloidal gearbox</h3>
    <div style="font-size:13.5px;max-width:78ch;margin-bottom:12px">
      Fifteen lobes rolling inside sixteen pins. The blue cam orbits the disc by one millimetre;
      the disc walks backwards one pin per motor turn, which is where 15:1 comes from. Purple pins carry
      that motion out as pure rotation.</div>
    <div class="pkg">
      <div><svg viewBox="0 0 400 400" width="100%" style="max-width:420px" id="simGear"></svg></div>
      <div>
        <div class="field"><label class="fl">Motor speed · rpm</label>
          <input type="range" id="simRpm" min="6" max="240" value="${SIM.rpm}" style="width:100%"></div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="act" id="simPlay">${SIM.run?'Pause':'Run'}</button>
          <button class="act" id="simStep">Step 30°</button>
          <button class="act" id="simZero">Reset</button></div>
        <div class="out" id="simGearRead"></div>
        <div style="font-size:12.5px;color:var(--graphite);margin-top:10px">
          Red line is the motor. Purple line is the output. Watch how far the motor turns
          before the output moves visibly — that is the reduction you are buying.</div>
      </div></div></div>

  <div class="panel"><h3>Arm reach and joint torque</h3>
    <div style="font-size:13.5px;max-width:78ch;margin-bottom:12px">
      Drag the joints and watch the shoulder load. Torque is dominated by the elbow actuator hanging
      out on the first link, not by the payload — which is why link length matters more than head mass.</div>
    <div class="pkg">
      <div><svg viewBox="0 0 580 400" width="100%" id="simArm"></svg></div>
      <div>
        <div class="field"><label class="fl">Shoulder · <span id="lj0">${SIM.j[0]}</span>°</label>
          <input type="range" id="sj0" min="-30" max="110" value="${SIM.j[0]}" style="width:100%"></div>
        <div class="field"><label class="fl">Elbow · <span id="lj1">${SIM.j[1]}</span>°</label>
          <input type="range" id="sj1" min="-130" max="20" value="${SIM.j[1]}" style="width:100%"></div>
        <div class="field"><label class="fl">Wrist · <span id="lj2">${SIM.j[2]}</span>°</label>
          <input type="range" id="sj2" min="-90" max="90" value="${SIM.j[2]}" style="width:100%"></div>
        <div class="field"><label class="fl">Link length · <span id="llk">${SIM.link}</span> mm</label>
          <input type="range" id="slk" min="40" max="220" value="${SIM.link}" style="width:100%"></div>
        <div class="field"><label class="fl">Head mass · <span id="lpy">${SIM.pay}</span> g</label>
          <input type="range" id="spy" min="20" max="300" value="${SIM.pay}" style="width:100%"></div>
        <div id="simArmRead"></div>
      </div></div></div>`;

  $('#simRpm',el).oninput=e=>{SIM.rpm=+e.target.value;drawGearSim();};
  $('#simPlay',el).onclick=e=>{SIM.run=!SIM.run;e.target.textContent=SIM.run?'Pause':'Run';};
  $('#simStep',el).onclick=()=>{SIM.theta+=Math.PI/6;drawGearSim();};
  $('#simZero',el).onclick=()=>{SIM.theta=0;drawGearSim();};
  [['sj0',0,'lj0'],['sj1',1,'lj1'],['sj2',2,'lj2']].forEach(x=>{
    $('#'+x[0],el).oninput=e=>{SIM.j[x[1]]=+e.target.value;$('#'+x[2],el).textContent=e.target.value;drawArmSim();};});
  $('#slk',el).oninput=e=>{SIM.link=+e.target.value;$('#llk',el).textContent=e.target.value;drawArmSim();};
  $('#spy',el).oninput=e=>{SIM.pay=+e.target.value;$('#lpy',el).textContent=e.target.value;drawArmSim();};
  drawGearSim(); drawArmSim();
  if(!SIM.raf) simTick();
}



/* =====================================================================
   SHARED STATE — one number, wherever it appears
   A value measured in a test lands in Measurements, feeds the calculators,
   and shows up on the dashboard. It is never typed twice.
   ===================================================================== */
const TEST2MSR={T07:10, T11:11, T14:14, T23:17, T24:18};     // test id -> measurement number
const MSR2TEST=Object.fromEntries(Object.entries(TEST2MSR).map(([k,v])=>[v,k]));

function msr(n,fallback){                    // read a measurement as a number
  const v=parseFloat((S.answers||{})[n]);
  return isNaN(v)?fallback:v;
}
function setMsr(n,v,from){
  S.answers=S.answers||{};
  if(String(S.answers[n]||'')===String(v)) return;
  S.answers[n]=String(v);
  logAction('action','Measurement #'+n+' set to '+v+(from?' from '+from:''));
}
/* entering a value on a linked test writes it straight into Measurements */
function testValue(tid,v){
  S.tests=S.tests||{};
  S.tests[tid]=Object.assign({},S.tests[tid],{v:v});
  const n=TEST2MSR[tid];
  if(n!==undefined && String(v).trim()!=='') setMsr(n,v,'test '+tid);
  save();
}
/* and the reverse, so the test shows what Measurements already knows */
function testShownValue(tid){
  const st=(S.tests||{})[tid]||{};
  if(st.v!==undefined && st.v!=='') return st.v;
  const n=TEST2MSR[tid];
  return (n!==undefined) ? ((S.answers||{})[n]||'') : '';
}

const PSEUDO=[
{g:'Node firmware',n:'Boot and identify',code:
`on power up
    read the three ID jumper pins
    node_id = the three bits as a number
    if node_id is 0
        blink the fault pattern forever      // 0 is reserved for broadcast
    start the clock from the crystal
    if the crystal did not start
        raise FAULT_CLOCK and stay in a safe idle
    set up: pwm timer, adc triggered by the timer, i2c, can
    load saved calibration from flash
    if there is no calibration
        mode = NEEDS_CALIBRATION
    else
        mode = IDLE
    driver stays disabled until the first valid command`},

{g:'Node firmware',n:'Calibration, run once per motor',code:
`when told to calibrate
    disable the current loop
    apply a small fixed voltage to align the rotor to a known electrical angle
    wait for it to settle
    record encoder reading as zero_offset

    step the electrical angle forward through one full mechanical turn
    count how many electrical cycles happened
    pole_pairs = that count

    step forward again a little
    if the encoder reading went down instead of up
        direction = reversed

    with the motor disabled, average both current sense readings
    store those as the zero current offsets

    save zero_offset, pole_pairs, direction, current offsets to flash
    report them back over the bus
    mode = IDLE`},

{g:'Node firmware',n:'Current loop, the fast one',code:
`every pwm cycle, triggered by the timer                 // about 8 kHz
    read both phase currents from the adc
    subtract the stored zero offsets
    third phase current = zero minus the other two       // they always sum to zero

    read the encoder angle
    electrical angle = (mechanical angle minus zero_offset) times pole_pairs
    if direction is reversed, negate it

    transform the three phase currents into d and q using that angle
    error_q = target_q minus measured_q
    error_d = zero minus measured_d                      // we want no d axis current
    run a pi controller on each error
    clamp both outputs to the voltage limit

    transform back into three phase voltages
    write them to the pwm timer`},

{g:'Node firmware',n:'Position loop, the slow one',code:
`every control tick                                       // about 1 kHz
    if mode is POSITION
        error = target_angle minus measured_angle
        velocity_target = error times kp
        clamp velocity_target to the velocity limit
        torque_target = (velocity_target minus measured_velocity) times kd
    else if mode is VELOCITY
        torque_target = (target minus measured_velocity) times kd
    else if mode is TORQUE
        torque_target = target
    else
        torque_target = zero and disable the driver

    clamp torque_target to the current limit
    hand it to the current loop as target_q`},

{g:'Node firmware',n:'CAN handler and watchdog',code:
`when a frame arrives
    if the id does not match this node and is not broadcast
        ignore it
    if it is a command frame
        remember the time
        copy mode, target, kp, kd out of it
        build a state frame: position, velocity, iq, temperature, faults
        send it straight back
    if it is a config frame
        apply the parameter, and save to flash if asked

every control tick
    if time since the last command is more than 100 ms
        raise FAULT_WATCHDOG
        disable the driver                                // coast, do not brake
    if any fault bit is set
        disable the driver
        send a fault frame at a low rate until it clears`},

{g:'Node firmware',n:'Homing against a hard stop',code:
`when told to home
    mode = TORQUE
    set a low current limit, about a fifth of normal
    drive slowly toward the stop
    watch the measured current and the velocity

    when current stays high and velocity is near zero for 200 ms
        we are against the stop
        record this encoder position as the reference
        back off by five degrees
        mode = IDLE
        report homed

    if it never stalls within the expected travel
        raise FAULT_HOMING and stop
        the joint is probably not free, or the stop did not print`},

{g:'Brain firmware',n:'Main loop',code:
`every 5 ms                                                // 200 Hz
    read the imu
    read the touch controller
    if the depth imager has new data, read it
    if the microphones have a full buffer, compute a bearing

    fuse those into a small picture of the world:
        is something near, and where
        did someone speak, and from where
        was the robot touched, or picked up

    ask the behaviour state machine what to do about it
    that produces: a gaze target, an arm pose, a head expression

    split the gaze between the head and the base            // see gaze arbitration
    turn the arm pose into three joint angles
    send one command frame to each node
    send one expression frame to the head

    collect the replies
    if any node reports a fault, or stops replying
        stop commanding motion and show the fault`},

{g:'Brain firmware',n:'Gaze arbitration',code:
`given a bearing to whatever we want to look at

    error = bearing minus current head pan
    head_pan_target = head_pan_target plus error           // the head reacts at once

    base_yaw_target = base_yaw_target plus head_pan_target times 0.02
                                                            // the body follows slowly
    clamp head_pan_target to the head limits

    the effect: a quick glance moves only the head.
    sustained attention brings the body round and lets the head recentre.
    that is how real gaze works, and it is two lines.`},

{g:'Brain firmware',n:'Behaviour state machine',code:
`states: SLEEP, IDLE, ATTEND, LISTEN, REACT, WORK, FAULT

IDLE
    slow breathing on the ear lights, occasional look around
    if a sound bearing arrives      -> LISTEN
    if something comes near         -> ATTEND
    if touched                      -> REACT
    if nothing for ten minutes      -> SLEEP

LISTEN
    turn toward the bearing, narrow the eyes
    hold for two seconds, then -> IDLE unless something else happens

ATTEND
    track the near object with the head
    if it comes very close         -> pull back, REACT

REACT
    short animation matched to the trigger
    then -> IDLE

WORK
    entered only on an explicit command
    ignore most interruptions, but never ignore FAULT

FAULT
    stop all motion, hold the fault expression
    only a deliberate reset leaves this state`},

{g:'Head firmware',n:'Render loop',code:
`every 33 ms                                                // 30 fps
    step the current animation forward one frame
    ease every value toward its target rather than jumping

    draw the eyes:
        height from the blink and squint state
        offset from the gaze target
        squash slightly when moving, it reads as weight

    set the ear colour from the mood, but lag the eyes by about 150 ms
        the face changes first and the glow catches up.
        that small delay reads as a body responding to a feeling.

    if the servos have arrived at their targets
        detach them so they go silent

    if no bus traffic for two seconds
        fade to a dim idle animation
        a frozen expression looks far worse than looking asleep`},

{g:'Head firmware',n:'Servo motion',code:
`to move a servo to a new angle
    if the change is smaller than two degrees
        ignore it                                           // otherwise cheap servos hunt
    attach the servo
    over 200 to 400 ms
        step the position along a cosine ramp
        linear motion looks robotic, eased motion looks alive
    when it arrives
        wait 100 ms
        detach`},

{g:'PC side',n:'Vision loop, optional',code:
`every 50 ms                                                // 20 Hz
    grab a frame from the camera
    detect faces and hands
    pick the most interesting one:
        a face beats a hand
        nearer beats further
        the one we were already tracking beats a new one

    convert its image position into a bearing relative to the head
    send: bearing, what it is, how confident

    separately, and much more slowly
        if the person said something, transcribe it
        ask the language model what to do
        it can only reply with one of the intents the robot knows
        send that intent, never raw motor commands

    if the serial link drops
        do nothing. the robot carries on without us.`}
];

function renderTest(){
  const el=$('#t-test');
  const mode=S.testView||'tests';
  const res=S.tests||{};
  const counts=k=>TESTS.concat(INTEG).filter(t=>(res[t.id]||{}).r===k).length;
  el.innerHTML=`
  <div class="panel" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <div style="display:flex;border:1px solid var(--rule)">
      ${[['tests','Test procedures'],['integ','Integration'],['pseudo','Pseudocode']].map(x=>
      `<button class="act" data-t="${x[0]}" style="border:0;border-right:1px solid var(--rule);
        background:${mode===x[0]?'var(--bluep)':'#fff'};font-weight:${mode===x[0]?600:400}">${x[1]}</button>`).join('')}
    </div>
    <span style="font-size:12.5px;color:var(--graphite)">
      ${counts('pass')} passed · ${counts('fail')} failed · ${counts('blocked')} blocked ·
      ${TESTS.length+INTEG.length-counts('pass')-counts('fail')-counts('blocked')} not run
    </span>
  </div><div id="tb"></div>`;
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.testView=b.dataset.t;save();renderTest();});
  const c=$('#tb',el);

  if(mode==='pseudo'){
    [...new Set(PSEUDO.map(p=>p.g))].forEach(g=>{
      const h=document.createElement('div');h.className='stage-head';h.innerHTML=`<h3>${esc(g)}</h3>`;c.appendChild(h);
      PSEUDO.filter(p=>p.g===g).forEach(p=>{
        const d=document.createElement('div');d.className='panel';
        d.innerHTML=`<h3>${esc(p.n)}</h3><pre class="pcode">${esc(p.code)}</pre>`;
        c.appendChild(d);});
    });
    return;
  }

  const list = mode==='integ' ? INTEG : TESTS;
  const groups = mode==='integ' ? ['Integration'] : [...new Set(TESTS.map(t=>t.g))];
  groups.forEach(g=>{
    const items = mode==='integ' ? INTEG : TESTS.filter(t=>t.g===g);
    const h=document.createElement('div');h.className='stage-head';
    const p=items.filter(t=>(res[t.id]||{}).r==='pass').length;
    h.innerHTML=`<h3>${esc(g)}</h3><span class="mono" style="font-size:12.5px;color:var(--graphite)">${p}/${items.length} passed</span>`;
    c.appendChild(h);
    items.forEach(t=>{
      const st=res[t.id]||{};
      const col=st.r==='pass'?'var(--done)':st.r==='fail'?'var(--gate)':st.r==='blocked'?'var(--amber)':'var(--hair)';
      const d=document.createElement('div'); d.className='chunk'; d.style.borderLeftColor=col;
      if(st.r==='pass') d.style.background='var(--donep)';
      d.innerHTML=`
      <div class="ctop" tabindex="0" role="button">
        <span class="cid mono" style="width:30px">${t.id}</span>
        <h4>${esc(t.n)}</h4>
        ${st.r?`<span class="flag" style="color:${col};border-color:${col}">${st.r}</span>`:''}
      </div>
      <div class="cbody" style="padding-left:52px">
        ${t.needs?'<h5>Needs</h5><div>'+esc(t.needs)+'</div>':''}
        <h5>Procedure</h5><ol>${t.steps.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol>
        <h5>Passes if</h5><div class="cp">${esc(t.exp)}</div>
        ${t.fail?'<h5>If it fails</h5><div class="fail">'+esc(t.fail)+'</div>':''}
        <h5>Result</h5>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <div style="display:flex;border:1px solid var(--rule)">
            ${['pass','fail','blocked'].map(r=>`<button class="act" data-r="${r}"
              style="border:0;border-right:1px solid var(--rule);background:${st.r===r?'var(--bluep)':'#fff'};
              font-weight:${st.r===r?600:400}">${r}</button>`).join('')}
          </div>
          ${t.unit?`<input type="text" class="tv" placeholder="measured${t.unit?' ('+t.unit+')':''}"
            value="${esc(testShownValue(t.id))}" style="max-width:170px">`:''}
          ${TEST2MSR[t.id]!==undefined?`<span class="chip" style="border-color:var(--blue);color:var(--blue)">shared with measurement #${TEST2MSR[t.id]}</span>`:''}
        </div>
        <textarea class="tn" style="margin-top:9px" placeholder="What you saw">${esc(st.note||'')}</textarea>
      </div>`;
      const top=$('.ctop',d);
      top.onclick=()=>d.classList.toggle('open');
      top.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();d.classList.toggle('open');}};
      d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
        S.tests=S.tests||{};
        S.tests[t.id]=Object.assign({},S.tests[t.id],{r:b.dataset.r});
        logAction('action','Test '+t.id+' '+t.n+' → '+b.dataset.r);
        save(); renderTest();
        setTimeout(()=>{const e2=document.querySelector('#tb .chunk');},10);
      });
      const tv=$('.tv',d), tn=$('.tn',d);
      if(tv){ tv.oninput=()=>testValue(t.id,tv.value);
              tv.onblur=()=>{renderTest();renderMsr();renderTools();renderHeader();}; }
      tn.oninput=()=>{S.tests=S.tests||{};S.tests[t.id]=Object.assign({},S.tests[t.id],{note:tn.value});save();};
      c.appendChild(d);
    });
  });
}

/* =====================================================================
   VERSIONS — snapshot the whole project state, browse it, restore it
   ===================================================================== */
const COMMON_COMMENTS=[
 'Works as expected',
 'Works, with a workaround',
 'Works but marginal — revisit',
 'Intermittent, not reproducible yet',
 'Fails at the checkpoint',
 'Blocked on a part that has not arrived',
 'Blocked on a measurement',
 'Needs a mechanical redesign',
 'Reprint with different settings',
 'Re-etch the board',
 'Firmware issue, not hardware',
 'Hardware issue, not firmware',
 'Superseded by a later version',
 'Reference snapshot, nothing changed'];

let LIVE=null;                       // stashed live state while browsing a version
const viewing=()=>!!LIVE;

function snapshot(){
  const c=JSON.parse(JSON.stringify(S));
  delete c.versions; delete c.__view;
  return c;
}
function nextVersionName(){
  const n=(S.versions||[]).length+1;
  return 'v'+n;
}
function saveVersion(name,working,desc,tag){
  S.versions=S.versions||[];
  const v={id:'V'+Date.now().toString(36),name:name||nextVersionName(),ts:new Date().toISOString(),
    working:working,desc:desc||'',tag:tag||'',snap:snapshot(),
    chunks:doneCount(),of:CHUNKS.length};
  S.versions.unshift(v);
  logAction('version','Saved '+v.name+' · '+(working==='yes'?'working':working==='no'?'not working':'partial')
    +(tag?' · '+tag:'')+(desc?' — '+desc:''));
  save(); renderAll();
}
function enterView(v){
  LIVE=JSON.parse(JSON.stringify(S));
  const keep=S.versions;
  S=JSON.parse(JSON.stringify(v.snap));
  S.versions=keep; S.__view=v.id;
  renderAll(); window.scrollTo({top:0});
}
function exitView(){
  const keep=S.versions;
  S=LIVE; S.versions=keep; LIVE=null; delete S.__view;
  renderAll(); window.scrollTo({top:0});
}
function restoreVersion(v){
  if(!confirm('Replace your current progress with '+v.name+'? Your live state is saved as a version first.')) return;
  if(viewing()) exitView();
  saveVersion('before restore of '+v.name,'partial','Automatic snapshot taken before restoring.','Reference snapshot, nothing changed');
  const keep=S.versions;
  S=JSON.parse(JSON.stringify(v.snap)); S.versions=keep;
  logAction('version','Restored '+v.name);
  save(); renderAll();
}
function deleteVersion(v){
  if(!confirm('Delete '+v.name+'? This cannot be undone.')) return;
  S.versions=(S.versions||[]).filter(x=>x.id!==v.id);
  logAction('version','Deleted '+v.name);
  save(); renderAll();
}
function diffVersions(a,b){
  const A=a.snap||{}, B=b.snap||{};
  const ch=CHUNKS.filter(c=>!!(A.chunks||{})[c.id]!==!!(B.chunks||{})[c.id]).map(c=>c.id);
  const ans=QUESTIONS.filter(q=>((A.answers||{})[q.n]||'')!==((B.answers||{})[q.n]||'')).map(q=>q.n);
  const bom=Object.keys(Object.assign({},A.bom,B.bom)).filter(k=>
    !!((A.bom||{})[k]||{}).have !== !!((B.bom||{})[k]||{}).have);
  return {ch,ans,bom};
}

function renderVer(){
  const el=$('#t-ver');
  const vs=S.versions||[];
  el.innerHTML=`
  <div class="panel">
    <h3>Save a version</h3>
    <div class="grid g2">
      <div>
        <div class="field"><label class="fl">Name</label>
          <input type="text" id="vName" placeholder="${esc(nextVersionName())}"></div>
        <div class="field"><label class="fl">Does it work?</label>
          <div style="display:flex;gap:0;border:1px solid var(--rule)" id="vWork">
            ${[['yes','Yes'],['partial','Partly'],['no','No']].map(x=>
              `<button class="act" data-w="${x[0]}" style="flex:1;border:0;border-right:1px solid var(--rule)">${x[1]}</button>`).join('')}
          </div></div>
        <div class="field"><label class="fl">Common comment</label>
          <select id="vTag"><option value="">— pick one —</option>
            ${COMMON_COMMENTS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
      </div>
      <div>
        <div class="field"><label class="fl">What changed, and what happened</label>
          <textarea id="vDesc" style="min-height:118px" placeholder="Third etch. Fanout clean this time after slowing the iron down. Encoder reads MD alone at 5.5 mm."></textarea></div>
        <button class="act" id="vSave" style="border-color:var(--blue);color:var(--blue);font-weight:600">Save version</button>
        <span id="vHint" style="font-size:12.5px;color:var(--graphite);margin-left:8px">pick a working status first</span>
      </div>
    </div>
  </div>
  <div id="vList"></div>`;

  let W='';
  const wb=$('#vWork',el);
  wb.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    W=b.dataset.w;
    wb.querySelectorAll('button').forEach(x=>{
      const on=x.dataset.w===W;
      x.style.background=on?(W==='yes'?'var(--donep)':W==='no'?'var(--gatep)':'var(--amberp)'):'#fff';
      x.style.fontWeight=on?600:400;
    });
    $('#vHint',el).textContent='ready to save';
  });
  $('#vSave',el).onclick=()=>{
    if(!W){ $('#vHint',el).textContent='choose Yes, Partly or No first'; return; }
    saveVersion($('#vName',el).value.trim(), W, $('#vDesc',el).value.trim(), $('#vTag',el).value);
  };

  const L=$('#vList',el);
  if(!vs.length){
    L.innerHTML=`<div class="panel"><div style="color:var(--graphite);font-size:13.5px">
      No versions yet. Save one after every meaningful attempt — a board etch, a gearbox print,
      a firmware bring-up — so you can get back to the last state that worked.</div></div>`;
    return;
  }
  L.innerHTML='<div class="stage-head"><h3>Saved versions</h3><span class="mono" style="color:var(--graphite);font-size:12.5px">'+vs.length+'</span></div>';
  vs.forEach((v,i)=>{
    const isView=S.__view===v.id;
    const col=v.working==='yes'?'var(--done)':v.working==='no'?'var(--gate)':'var(--amber)';
    const bg=v.working==='yes'?'var(--donep)':v.working==='no'?'var(--gatep)':'var(--amberp)';
    const prev=vs[i+1];
    const d=diffVersions(prev||{snap:{}},v);
    const card=document.createElement('div');
    card.className='panel';
    card.style.borderLeft='4px solid '+col;
    if(isView) card.style.background='var(--bluep)';
    card.innerHTML=`
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <div style="font-size:17px;font-weight:600">${esc(v.name)}</div>
        <span class="flag" style="color:${col};border-color:${col};background:${bg}">
          ${v.working==='yes'?'working':v.working==='no'?'not working':'partly working'}</span>
        ${v.tag?`<span class="chip">${esc(v.tag)}</span>`:''}
        <span class="mono" style="font-size:12px;color:var(--graphite);margin-left:auto">
          ${new Date(v.ts).toLocaleString()} · ${v.chunks}/${v.of} chunks</span>
      </div>
      ${v.desc?`<div style="font-size:14px;margin-top:8px;white-space:pre-wrap;max-width:75ch">${esc(v.desc)}</div>`:''}
      ${(d.ch.length||d.ans.length||d.bom.length)?`<div style="font-size:12.5px;color:var(--graphite);margin-top:8px">
        Changed since ${prev?esc(prev.name):'the start'}:
        ${d.ch.length?'<span class="chip">'+d.ch.length+' chunk'+(d.ch.length>1?'s':'')+' · '+d.ch.join(', ')+'</span>':''}
        ${d.ans.length?'<span class="chip">'+d.ans.length+' measurement'+(d.ans.length>1?'s':'')+'</span>':''}
        ${d.bom.length?'<span class="chip">'+d.bom.length+' part'+(d.bom.length>1?'s':'')+'</span>':''}
      </div>`:''}
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="act" data-a="view">${isView?'Stop viewing':'View this state'}</button>
        <button class="act" data-a="restore">Restore</button>
        <button class="act danger" data-a="del">Delete</button>
      </div>`;
    card.querySelector('[data-a=view]').onclick=()=>{ isView?exitView():enterView(v); };
    card.querySelector('[data-a=restore]').onclick=()=>restoreVersion(v);
    card.querySelector('[data-a=del]').onclick=()=>deleteVersion(v);
    L.appendChild(card);
  });
}

function renderBanner(){
  let b=document.getElementById('viewBanner');
  if(!viewing()){ if(b) b.remove(); return; }
  const v=(S.versions||[]).find(x=>x.id===S.__view)||{name:'a saved version'};
  if(!b){
    b=document.createElement('div'); b.id='viewBanner';
    document.querySelector('.wrap').prepend(b);
  }
  b.className='viewbanner';
  b.innerHTML=`<span><strong>Viewing ${esc(v.name)}</strong> — this is a saved snapshot. Nothing you change here is kept.</span>
    <button class="act" id="vExit">Return to current</button>`;
  b.querySelector('#vExit').onclick=exitView;
}



/* =====================================================================
   BROWSER TAB SYNC — two copies of this file open at once would otherwise
   clobber each other, because the last one to save wins.
   ===================================================================== */
let LAST_WRITE=0;
window.addEventListener('storage', e=>{
  if(Store.mode()!=='local' || e.key!==KEY || !e.newValue) return;
  if(Date.now()-LAST_WRITE < 800) return;          // that was our own write coming back
  if(viewing()) return;                            // do not disturb a snapshot being read
  try{
    const inc=JSON.parse(e.newValue);
    S=Object.assign(S,inc);
    renderAll();
    setStatus('Updated from another tab '+new Date().toLocaleTimeString());
  }catch(err){}
});

/* =====================================================================
   SESSION GUARD — a version has to be saved before you walk away
   ===================================================================== */
let ALLOW_LEAVE=false;

function lastVersion(){ return (S.versions||[])[0]||null; }
function fingerprint(){
  const c=snapshot();
  delete c.log; delete c.logFilter; delete c.schemView; delete c.bomScope; delete c.started;
  return JSON.stringify(c);
}
function isDirty(){
  if(viewing()) return false;
  const v=lastVersion();
  if(!v) return Object.keys(S.chunks||{}).length>0 || (S.log||[]).length>0;
  return JSON.stringify((()=>{const c=JSON.parse(JSON.stringify(v.snap));
    delete c.log; delete c.logFilter; delete c.schemView; delete c.bomScope; delete c.started; return c;})())
    !== fingerprint();
}

function openCloseModal(reason){
  if(document.getElementById('cmodal')) return;
  const v=lastVersion();
  const d=document.createElement('div');
  d.id='cmodal'; d.className='modalwrap';
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="cmTitle">
    <h3 id="cmTitle">Save a version before you stop</h3>
    <p class="cmsub">${esc(reason||'You have changed things since '+(v?v.name:'the start')+'. Record what state the build is in so you can get back to it.')}</p>
    <div class="field"><label class="fl">Name</label>
      <input type="text" id="cmName" placeholder="${esc(nextVersionName())}"></div>
    <div class="field"><label class="fl">Does it work right now?</label>
      <div style="display:flex;border:1px solid var(--rule)" id="cmWork">
        ${[['yes','Yes'],['partial','Partly'],['no','No']].map(x=>
        `<button class="act" data-w="${x[0]}" style="flex:1;border:0;border-right:1px solid var(--rule)">${x[1]}</button>`).join('')}
      </div></div>
    <div class="field"><label class="fl">Common comment</label>
      <select id="cmTag"><option value="">— pick one —</option>
        ${COMMON_COMMENTS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label class="fl">What changed, and where you stopped</label>
      <textarea id="cmDesc" style="min-height:88px" placeholder="Etched board two. Fanout clean. Stopped before populating — need to find the 1206 tweezers."></textarea></div>
    <div class="cmbtns">
      <button class="act" id="cmSave" style="border-color:var(--blue);color:var(--blue);font-weight:600">Save version and close</button>
      <button class="act" id="cmBack">Keep working</button>
      <button class="act danger" id="cmSkip">Close without saving</button>
    </div>
    <div class="cmhint" id="cmHint">Choose Yes, Partly or No first.</div>
  </div>`;
  document.body.appendChild(d);

  let W='';
  const wb=d.querySelector('#cmWork');
  wb.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    W=b.dataset.w;
    wb.querySelectorAll('button').forEach(x=>{
      const on=x.dataset.w===W;
      x.style.background=on?(W==='yes'?'var(--donep)':W==='no'?'var(--gatep)':'var(--amberp)'):'#fff';
      x.style.fontWeight=on?600:400;});
    d.querySelector('#cmHint').textContent='Ready. Saving also lets you close the tab.';
  });
  d.querySelector('#cmSave').onclick=()=>{
    if(!W){ d.querySelector('#cmHint').textContent='Choose Yes, Partly or No first.'; return; }
    saveVersion(d.querySelector('#cmName').value.trim(), W,
      d.querySelector('#cmDesc').value.trim(), d.querySelector('#cmTag').value);
    ALLOW_LEAVE=true; d.remove();
    setStatus('Version saved — you can close the tab now');
    setTimeout(()=>{ALLOW_LEAVE=false;}, 120000);
  };
  d.querySelector('#cmBack').onclick=()=>d.remove();
  d.querySelector('#cmSkip').onclick=()=>{
    logAction('action','Closed without saving a version');
    ALLOW_LEAVE=true; d.remove(); save();
    setStatus('Leaving without a version — the tab will not warn you again for two minutes','warn');
    setTimeout(()=>{ALLOW_LEAVE=false;}, 120000);
  };
  d.addEventListener('keydown',e=>{ if(e.key==='Escape') d.remove(); });
  setTimeout(()=>{const n=d.querySelector('#cmName'); if(n) n.focus();},30);
}

window.addEventListener('beforeunload', e=>{
  if(ALLOW_LEAVE || !isDirty()) return;
  e.preventDefault();
  e.returnValue='';               // browsers show their own generic warning here
  return '';
});

/* When the tab comes back after being hidden with unsaved work, prompt properly.
   The browser will not let a page draw its own dialog during unload, so this is
   the honest place to ask. */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && isDirty() && !ALLOW_LEAVE){
    const v=lastVersion();
    setStatus('Unsaved since '+(v?v.name:'the start')+' — save a version before you stop','warn');
  }
});

function renderDirtyChip(){
  const el=document.getElementById('dirtyChip'); if(!el) return;
  if(viewing()){ el.innerHTML=''; return; }
  const v=lastVersion();
  el.innerHTML = isDirty()
    ? `<span class="chip" style="border-color:var(--amber);color:var(--amber);background:var(--amberp)">unsaved since ${esc(v?v.name:'the start')}</span>`
    : `<span class="chip" style="border-color:var(--done);color:var(--done);background:var(--donep)">saved as ${esc(v?v.name:'—')}</span>`;
}

/* =====================================================================
   WIRING
   ===================================================================== */
const TABS=['dash','run','ord','bom','msr','tools','schem','sim','pin','test','ref','ver','log'];
function show(t){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  TABS.forEach(x=>{document.getElementById('t-'+x).hidden=(x!==t);});
  window.scrollTo({top:0});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));

$('#bEnd').onclick=()=>openCloseModal();
$('#bExp').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='deskarm-progress-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);setStatus('Progress exported');
};
$('#bImp').onclick=()=>$('#fIn').click();
$('#fIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      S=Object.assign({chunks:{},notes:{},orders:{},goodsin:{},answers:{},bom:{},pins:{},log:[],started:null,bomScope:'node',nodeCount:3,bomEdit:{},bomAdd:[],ordEdit:{},ordAdd:[],versions:[],nets:{},schemView:'schematic',tests:{}},JSON.parse(r.result));
      logAction('action','Imported progress from a file');save();renderAll();setStatus('Progress imported');
    }catch(err){ setStatus('That file is not valid progress data','err'); } };
  r.readAsText(f);
};
$('#bRst').onclick=()=>{
  if(!confirm('Clear every checkbox, note, measurement and log entry? Export first if you want a copy.')) return;
  S={chunks:{},notes:{},orders:{},goodsin:{},answers:{},bom:{},pins:{},log:[],started:null,bomScope:'node',nodeCount:3,bomEdit:{},bomAdd:[],ordEdit:{},ordAdd:[],versions:[],nets:{},schemView:'schematic',tests:{}};
  save();renderAll();setStatus('Everything reset');
};

function renderAll(){ renderBanner();renderDirtyChip();renderHeader();renderDash();renderRun();renderOrd();renderBom();renderMsr();renderTools();renderSchem();renderSim();renderPin();renderTest();renderRef();renderVer();renderLog(); }

(async()=>{
  const mode=await Store.init();
  const raw=await Store.get();
  if(raw){ try{ S=Object.assign(S,JSON.parse(raw)); }catch(e){} }
  if(!S.started) S.started=new Date().toISOString();
  renderAll();
  setStatus(mode==='memory'
    ? 'Progress is not being saved here — export before you close'
    : (raw?'Progress loaded':'Ready — progress saves automatically'),
    mode==='memory'?'warn':'');
})();
</script>
</body>
