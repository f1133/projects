<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk arm · build console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFEEE9; --card:#FBFBF9; --ink:#15171B; --graphite:#5A6170; --faint:#8A8F9A;
  --rule:#C9C7C0; --hair:#DEDCD5;
  --blue:#1B4B8F; --blue2:#3E7ACB; --bluep:#E5EDF8;
  --gate:#A32D2D; --gatep:#F8E8E8;
  --done:#2C6A4E; --donep:#E5F0E9;
  --amber:#9C6B14; --amberp:#FAF0DA;
  --copper:#B0703A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{letter-spacing:-.01em;margin:0}
a{color:var(--blue)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 96px}

/* header */
header{border-bottom:2px solid var(--ink);padding:22px 0 0}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.htitle{font-size:25px;font-weight:700}
.hsub{color:var(--graphite);font-size:13px;margin-top:2px}
.hstat{display:flex;gap:22px;font-size:13px;color:var(--graphite)}
.hstat b{display:block;font-size:19px;color:var(--ink);font-weight:600}
nav{display:flex;margin-top:16px;overflow-x:auto;gap:0}
nav button{background:none;border:0;border-bottom:3px solid transparent;font:inherit;font-weight:500;color:var(--graphite);padding:10px 15px 8px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--blue)}
nav button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
section{padding-top:26px}

/* generic blocks */
.panel{border:1px solid var(--rule);background:var(--card);padding:18px 20px;margin-bottom:14px}
.panel>h3{font-size:14px;color:var(--graphite);font-weight:600;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

.now{border:1px solid var(--rule);border-left:5px solid var(--blue);background:var(--card);padding:20px 22px}
.now.gate{border-left-color:var(--gate)}.now.decision{border-left-color:var(--amber)}
.now .k{font-size:12.5px;color:var(--graphite)}
.now h2{font-size:21px;margin:3px 0 3px}
.now .m{font-size:13px;color:var(--graphite);margin-bottom:12px}
.cp{background:var(--bluep);border-left:3px solid var(--blue);padding:9px 12px;font-size:14px;margin:12px 0 0}
.gate .cp{background:var(--gatep);border-left-color:var(--gate)}
.fail{background:#F4F3EF;border-left:3px solid var(--graphite);padding:9px 12px;font-size:13.5px;color:#3E434E;margin:10px 0 0}

/* chunks */
.stage-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.stage-head h3{font-size:14.5px}
.chunk{border:1px solid var(--rule);border-left:4px solid var(--hair);background:var(--card);margin-bottom:7px}
.chunk.done{border-left-color:var(--done);background:var(--donep)}
.chunk.gate{border-left-color:var(--gate)}.chunk.crit{border-left-color:var(--blue)}.chunk.decision{border-left-color:var(--amber)}
.ctop{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;cursor:pointer}
.ctop:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.chunk input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--done);flex:none;cursor:pointer}
.cid{font-size:12.5px;font-weight:600;color:var(--blue);width:24px;flex:none;padding-top:2px}
.chunk.done .cid{color:var(--done)}
.chunk h4{font-size:15px;font-weight:600;flex:1}
.chunk.done h4{color:var(--graphite);text-decoration:line-through;text-decoration-color:var(--rule)}
.ctime{font-size:12.5px;color:var(--graphite);flex:none}
.flag{font-size:10.5px;font-weight:600;padding:1px 6px;border:1px solid;flex:none}
.flag.gate{color:var(--gate);border-color:var(--gate);background:var(--gatep)}
.flag.crit{color:var(--blue);border-color:var(--blue);background:var(--bluep)}
.flag.decision{color:var(--amber);border-color:var(--amber);background:var(--amberp)}
.cbody{display:none;padding:13px 14px 15px 49px;border-top:1px dashed var(--rule)}
.chunk.open .cbody{display:block}
.cbody h5{font-size:12px;color:var(--graphite);margin:13px 0 4px;font-weight:600}
.cbody h5:first-child{margin-top:0}
.cbody ol{margin:0;padding-left:19px}.cbody ol li{margin-bottom:4px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--graphite);font-weight:600;padding:0 8px 6px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
tr.ok td{background:var(--donep)}
input[type=text],input[type=date],input[type=number],select,textarea{
  font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--rule);background:#fff;width:100%}
textarea{resize:vertical;min-height:52px;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
label.fl{display:block;font-size:12px;color:var(--graphite);margin-bottom:3px}
.field{margin-bottom:10px}

/* question cards */
.q{border:1px solid var(--rule);border-left:4px solid var(--hair);background:var(--card);padding:12px 14px;margin-bottom:7px}
.q.blocking{border-left-color:var(--gate)}
.q.filled{border-left-color:var(--done);background:var(--donep)}
.qh{display:flex;gap:9px;align-items:baseline}
.qn{font-size:12.5px;font-weight:600;color:var(--blue);width:22px;flex:none}
.qt{font-weight:600;font-size:14.5px;flex:1}
.qm{font-size:12.5px;color:var(--graphite);margin:2px 0 8px 31px}
.qi{margin-left:31px;max-width:320px}

details{border:1px solid var(--rule);background:var(--card);margin-bottom:6px}
summary{padding:10px 14px;cursor:pointer;font-weight:500;font-size:14px}
summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
details[open] summary{border-bottom:1px dashed var(--rule)}
.dc{padding:12px 14px;font-size:14px}

/* calculators */
.calc{border:1px solid var(--rule);background:var(--card);padding:16px 18px}
.calc h4{font-size:15px;margin-bottom:3px}
.calc .why{font-size:12.5px;color:var(--graphite);margin-bottom:12px}
.out{background:var(--bluep);border-left:3px solid var(--blue);padding:10px 12px;margin-top:10px;font-size:14px}
.out.warn{background:var(--gatep);border-left-color:var(--gate)}
.out.good{background:var(--donep);border-left-color:var(--done)}
.out b{font-size:17px}

/* log */
.logent{border-left:3px solid var(--rule);padding:2px 0 12px 14px;margin-left:6px;position:relative}
.logent::before{content:'';position:absolute;left:-6px;top:6px;width:9px;height:9px;background:var(--blue);border:2px solid var(--card)}
.logdate{font-size:12px;color:var(--graphite)}

/* footer bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ink);padding:8px 18px;display:flex;gap:9px;align-items:center;justify-content:space-between;font-size:12.5px;z-index:9}
.st{color:var(--graphite)}.st.err{color:var(--gate)}.st.warn{color:var(--amber)}
button.act{font:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--ink);background:#fff;cursor:pointer}
button.act:hover{background:var(--bluep)}
button.act:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button.danger{border-color:var(--gate);color:var(--gate)}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--rule);background:#fff;color:var(--graphite)}
svg text{font-family:'IBM Plex Sans',sans-serif}
.pkg{display:grid;grid-template-columns:minmax(280px,1fr) minmax(260px,1fr);gap:18px;align-items:start}
@media(max-width:860px){.pkg{grid-template-columns:1fr}}
.pintbl{font-size:12.5px}
.pintbl td{padding:2px 5px;border-bottom:1px solid var(--hair)}
.pintbl input{padding:3px 5px;font-size:12.5px;border:1px solid transparent;background:transparent}
.pintbl input:hover{border-color:var(--rule);background:#fff}
.pintbl input:focus{border-color:var(--blue);background:#fff}
.pintbl .pn{width:34px;color:var(--faint);text-align:right}
.pintbl .pp{width:64px;font-weight:600;color:var(--blue)}
.pintbl tr.used td{background:var(--bluep)}
.pintbl tr.pwr td{background:#F4F3EF;color:var(--graphite)}
.warnbox{background:var(--gatep);border-left:3px solid var(--gate);padding:10px 13px;font-size:13.5px;margin-bottom:14px}
.polrow{display:flex;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.polrow:last-child{border-bottom:0}
.polrow svg{flex:none}
.polrow .pt{font-weight:600;font-size:14px}
.polrow .pd{font-size:13px;color:var(--graphite)}
pre.pcode{background:#F6F5F1;border-left:3px solid var(--blue);padding:14px 16px;margin:0;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;line-height:1.62;
  white-space:pre-wrap;overflow-x:auto;color:#22252B}
.modalwrap{position:fixed;inset:0;background:rgba(21,23,27,.55);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--ink);max-width:520px;width:100%;
  padding:22px 24px;max-height:88vh;overflow:auto}
.modal h3{font-size:19px;margin-bottom:4px}
.modal .cmsub{font-size:13.5px;color:var(--graphite);margin:0 0 16px}
.modal .cmbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal .cmhint{font-size:12.5px;color:var(--graphite);margin-top:9px}
.viewbanner{position:sticky;top:0;z-index:8;background:var(--blue);color:#fff;padding:9px 16px;
  display:flex;gap:14px;align-items:center;justify-content:space-between;font-size:13.5px;margin:0 -18px 0}
.viewbanner button{background:#fff;border-color:#fff}
.chip{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--rule);background:#fff;margin-left:6px;color:var(--graphite)}
.clickable{cursor:pointer}
@media(max-width:640px){.wrap{padding:0 12px 110px}.cbody{padding-left:14px}.bar{flex-wrap:wrap}}
</style>
</head>
<body>

<div class="wrap">
<header>
  <div class="hrow">
    <div>
      <div class="htitle">Desk arm · build console</div>
      <div class="hsub">Three direct-drive joints · CAN nodes on etched boards · detachable head</div>
    </div>
    <div class="hstat">
      <div><b id="sChunks">0/20</b>chunks</div>
      <div><b id="sDays">—</b>days in</div>
      <div><b id="sSpend">₹0</b>recorded</div>
      <div><b id="sBlock">5</b>blockers open</div>
    </div>
  </div>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="dash">Dashboard</button>
    <button role="tab" aria-selected="false" data-tab="run">Runbook</button>
    <button role="tab" aria-selected="false" data-tab="ord">Orders</button>
    <button role="tab" aria-selected="false" data-tab="bom">Parts</button>
    <button role="tab" aria-selected="false" data-tab="msr">Measurements</button>
    <button role="tab" aria-selected="false" data-tab="tools">Calculators</button>
    <button role="tab" aria-selected="false" data-tab="schem">Schematics</button>
    <button role="tab" aria-selected="false" data-tab="sim">Mechanism</button>
    <button role="tab" aria-selected="false" data-tab="pin">Pinouts</button>
    <button role="tab" aria-selected="false" data-tab="ref">Reference</button>
    <button role="tab" aria-selected="false" data-tab="test">Tests</button>
    <button role="tab" aria-selected="false" data-tab="ver">Versions</button>
    <button role="tab" aria-selected="false" data-tab="log">Build log</button>
  </nav>
</header>

<section id="t-dash"></section>
<section id="t-run" hidden></section>
<section id="t-ord" hidden></section>
<section id="t-bom" hidden></section>
<section id="t-msr" hidden></section>
<section id="t-tools" hidden></section>
<section id="t-schem" hidden></section>
<section id="t-sim" hidden></section>
<section id="t-pin" hidden></section>
<section id="t-ref" hidden></section>
<section id="t-test" hidden></section>
<section id="t-ver" hidden></section>
<section id="t-log" hidden></section>
</div>

<div class="bar">
  <span><span class="st" id="status">Loading…</span> <span id="dirtyChip"></span></span>
  <span>
    <button class="act" id="bEnd" style="border-color:var(--blue);color:var(--blue);font-weight:600">End session</button>
    <button class="act" id="bExp">Export</button>
    <button class="act" id="bImp">Import</button>
    <button class="act danger" id="bRst">Reset</button>
  </span>
</div>
<input type="file" id="fIn" accept="application/json" hidden>

<script>
"use strict";
/* =====================================================================
   STORAGE — works in three environments with no setup:
   1. Claude app        -> window.storage
   2. Downloaded file   -> localStorage
   3. Anything else     -> memory, with a visible warning to export
   ===================================================================== */
const KEY='deskarm.console.v2';
const Store=(()=>{
  let mode='memory', mem=null;
  return {
    async init(){
      if(typeof window!=='undefined' && window.storage && window.storage.get){
        mode='claude'; return mode;
      }
      try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); mode='local'; }
      catch(e){ mode='memory'; }
      return mode;
    },
    mode(){return mode;},
    async get(){
      if(mode==='claude'){ try{ const r=await window.storage.get(KEY); return r&&r.value?r.value:null; }catch(e){ return null; } }
      if(mode==='local') return localStorage.getItem(KEY);
      return mem;
    },
    async set(v){
      if(mode==='claude'){ await window.storage.set(KEY,v); return true; }
      if(mode==='local'){ localStorage.setItem(KEY,v); return true; }
      mem=v; return false;
    }
  };
})();

/* =====================================================================
   DATA
   ===================================================================== */
const STAGES={A:'While parts ship',B:'First actuator',C:'First node board',D:'Bus and safety',E:'The arm'};
const STAGE_ORDER=['A','B','C','D','E'];

const CHUNKS=[
{id:'A1',s:'A',t:'Toolchain on hardware you own',time:'2 h',f:'',dep:[],

 cp:'PC13 blinks, serial prints "alive".',
 fail:'Clone chips need upload_flags = -c set CPUTAPID 0x2ba01477. Flash size errors mean switching the board to bluepill_f103c8 (64k).',
 un:'Every firmware chunk.'},
{id:'A2',s:'A',t:'Encoder alone on the bench',time:'1 evening',f:'',dep:['A1'],
 needs:'One AS5600 and any diametric magnet',
 steps:['Wire AS5600: VCC 3.3, GND, SDA PB7, SCL PB6, DIR to GND','Build bluepill_encoder','Read the STATUS line printed at boot','Turn the magnet slowly by hand'],
 cp:'Smooth 0 to 6.283 ramp. MD set, ML and MH clear.',
 fail:'A once-per-rev wobble means the magnet is off the rotation axis. Fix the mounting now — no firmware hides this.',
 un:'A3, and it teaches you the STATUS register you need in B4.'},
{id:'A3',s:'A',t:'One motor, open then closed loop',time:'1 evening',f:'',dep:['A2'],
 needs:'A SimpleFOC Mini, a 2804, bench PSU at 9 V with a 1.5 A limit',
 steps:['Wire Mini: IN1 PB4, IN2 PB5, IN3 PB0, EN PB1','foc_test.cpp with STAGE 1, send T2','Run find_pole_pairs and write the number down','STAGE 2: initFOC() prints zero offset and direction','Record both in Measurements'],
 cp:'Spins smoothly both ways, no cogging, holds torque.',fail:'',
 un:'B6 and C4. These three numbers go into every node.'},
{id:'A4',s:'A',t:'CubeMX pin assignment',time:'2 h',f:'crit',dep:[],
 needs:'CubeMX installed',
 steps:['New project, STM32G431CBT6, LQFP48','Clock: HSE 8 MHz crystal, PLL, SYSCLK 170 MHz','TIM1 PWM CH1/2/3, centre aligned, period 4249, TRGO on Update','ADC1 injected IN2 and IN4, triggered by TIM1 TRGO','I2C1 fast mode plus, FDCAN1 classic 1 Mbps, SYS serial wire','GPIO: PB12 out, PC13 out, PB13/14/15 in pull-up','Check each group faces the side its traces need','Export the pinout CSV'],
 cp:'CSV exported, no conflicts, PWM on one side and the ADC pins on another.',
 fail:'If two groups want the same side, move the low-speed one. Never move the shunt sense pair or the PWM group.',
 un:'A5. The single most important prep chunk.'},
{id:'A5',s:'A',t:'KiCad board',time:'2 weekends',f:'crit',dep:['A4'],
 needs:'A4 done, the KiCad checklist',
 steps:['Schematic from the reference designators','Two custom footprints: AS5600 5 pads, Mini 6 pads with a 23×19 courtyard','Assign footprints, run ERC','Outline 50×45, draw the Ø48 circle at centre as a keep-out','Four corner connectors first, outside that circle','AS5600 pads at the exact centre','Mini footprint on the copper side','G431 under it, oriented per A4','Shunts and both INA240s as one block, sense pair under 15 mm','Route in checklist order, ground pour last'],
 cp:'DRC clean, under 15 jumpers, none under the LQFP, B.Cu plotted mirrored, 12 LQFP pads measure exactly 6.0 mm on paper.',
 fail:'',un:'C1.'},
{id:'A6',s:'A',t:'Test prints',time:'2 h',f:'',dep:[],
 needs:'Printer, PLA+',
 steps:['Print clearance_discs.stl at 0.10, 0.15, 0.20','Print spacer_set.stl — four spacers and the shim'],
 cp:'Six parts, clearance embossed and readable on each disc.',fail:'',un:'B3 and B4.'},

{id:'B1',s:'B',t:'Measure the motor',time:'30 min',f:'gate',dep:[],
 needs:'Calipers, the 2804 in hand',
 steps:['Does the shaft protrude below the stator?','Rotor-top screw square, M2 or M2.5','Stator-base screw square','Body height','Magnet protrusion below the base plate','Update the SCAD variables'],
 cp:'SCAD updated, total_h still echoes 51.',
 fail:'If the shaft does not protrude below the stator, STOP and re-plan. The encoder cannot see a magnet from underneath and everything downstream assumes it can.',
 un:'All mechanical work.'},
{id:'B2',s:'B',t:'Print the gearbox',time:'1 day unattended',f:'',dep:['B1'],
 needs:'SCAD updated from B1',
 steps:['Housing 3 h upright with brim','Cap 1.5 h flat, race side up','Two discs 1.5 h flat, 5 walls','Output plate 40 min flat','Cam 25 min upright, 100% infill in the journals'],
 cp:'Six parts, no warping, ring pin pockets crisp.',fail:'',un:'B3.'},
{id:'B3',s:'B',t:'Dry assembly',time:'2 h',f:'decision',dep:['B2','A6'],
 needs:'608ZZ ×2, 626ZZ ×3, dowels, M3×40',
 steps:['Press a 608ZZ into each disc — warm the disc, press square','Bolt the cam to the rotor with threadlocker','12 ring dowels, disc 1, disc 2 rotated 180°','Output plate with its six 3×12 dowels','Three 626ZZ into the cap race','Four M3×40 through, nuts in the cap pockets','No grease yet — turn the cam by hand'],
 cp:'Output turns 1/15 per motor turn. No binding, minimal slop.',
 fail:'Binding means try the next clearance disc up. Sloppy means down. This is what the three test prints were for.',
 un:'Everything mechanical. The moment of truth.'},
{id:'B4',s:'B',t:'Set the encoder gap',time:'1 h',f:'',dep:['B3'],
 needs:'Spacers, the 1 mm shim, an AS5600',

 fail:'ML means too far, MH means too close.',un:'B5.'},
{id:'B5',s:'B',t:'Grease and run in',time:'1 h',f:'',dep:['B4'],
 needs:'Lithium grease',

 cp:'It gets quieter, not louder.',
 fail:'Getting louder means something is wearing. Open it.',un:'B6.'},
{id:'B6',s:'B',t:'Measure backlash and efficiency',time:'1 h',f:'decision',dep:['B5','A3'],
 needs:'Lever arm, kitchen scale',
 steps:['Backlash: hold the rotor, wiggle the output, read the encoder delta','Efficiency: clamp a lever arm, command a known current, read force on the scale','Record both in Measurements'],
 cp:'Under 1° backlash means gear both joints. Over 2° means order GT2 pulleys and belts instead.',
 fail:'Efficiency under 65% means a hotter motor and a lower current_limit.',
 un:'The decision on whether the gearbox path continues.'},

{id:'C1',s:'C',t:'Etch board one',time:'1 evening',f:'crit',dep:['A5'],
 needs:'Copper clad, ferric chloride, transfer paper',
 steps:['Print the mirrored B.Cu plot','Clean the copper with fine abrasive then acetone — no fingerprints','Transfer, iron, soak, peel','Inspect the LQFP fanout under magnification BEFORE etching, touch up with a resist pen','Etch, rinse, strip toner'],
 cp:'No broken traces, no bridges. Continuity-check all 48 LQFP pads against the netlist before populating.',
 fail:'If the fanout bridges, re-etch. Do not try to cut it apart at 0.4 mm.',un:'C2.'},
{id:'C2',s:'C',t:'Populate the board',time:'1 evening',f:'',dep:['C1'],
 needs:'All node parts, flux, wick, magnification',
 steps:['Drill only what needs holes','SMD on the copper side, smallest first: G431, SOIC-8s, then 1206s','Inspect every LQFP joint under magnification','0 Ω jumpers','Through-hole connectors, plain side, corners only','AS5600 last, using the shim','Mini sockets'],
 cp:'Power up with nothing plugged in. 19 V and 5 V rails correct, nothing hot.',
 fail:'LQFP bridges come off with flux and wick. Do not add solder first.',un:'C3.'},
{id:'C3',s:'C',t:'Flash the node',time:'1 evening',f:'',dep:['C2','A4'],
 needs:'ST-Link',
 steps:['Clip the ST-Link to the five SWD pads','Import the CubeMX output into PlatformIO','Blink PC13'],

/* What each part actually does, and where it sits. Keyed on part name. */
const USE={
'STM32G431CBT6':'The brain of one joint. Runs the 8 kHz FOC current loop, reads the encoder over I2C, samples both INA240 outputs on ADC1, and answers CAN frames from the arm controller. It never knows what robot it is in — it takes a target and closes the loop.',
'SN65HVD230DR':'Turns the G431 logic-level CAN pins into the differential pair that survives 400 mm of cable running next to three motor phases. Without it the FDCAN peripheral cannot reach the wire.',
'SimpleFOC Mini':'The three half-bridges that actually switch current into the motor. Taking the module instead of a bare L6234 keeps the exposed thermal slug and the high-current gate layout off your hand-etched board. Mounts on sockets on the copper side, hanging in open air where it can cool.',
'AS5600 breakout':'Reads the rotor angle from a magnet in the shaft end. FOC cannot commutate without it — the electrical angle is what tells the driver which coils to energise. Soldered through the board with the chip facing the magnet.',
'INA240A1DR':'Amplifies the millivolts across each shunt into something the ADC can read, while rejecting the 19 V common-mode swing of a PWM phase wire. This is what makes real torque control possible instead of guessing from applied voltage.',
'Shunt 30 mΩ 1%':'Converts phase current into a voltage the INA240 can see. Two of them, inline in phases A and B — the third phase is computed. 30 mΩ at 1 A gives 30 mV, which at 20 V/V lands comfortably inside the ADC range.',
'NTC 10k MF52E103FL395':'Stator temperature. The motor sits inside a PLA housing that softens around 55 to 60 °C, so this is what lets firmware back off before the mount deforms. It also tells you why torque drifted — winding resistance rises about 0.4 percent per degree.',
'Resistor 100k':'Top half of the bus voltage divider. Lets the G431 measure the 19 V rail so SimpleFOC can compensate duty cycle when the supply sags under load.',
'Resistor 4k7':'Bottom half of that divider, and the pull-up that turns the NTC into a readable voltage.',
'AMS1117-3.3':'Drops the 5 V that arrives on the harness to the 3.3 V the MCU, encoder and INA240s need. The big tab is the only heatsink, so it wants copper area.',
'Capacitor 470 µF 50 V':'Local bulk right at the driver supply. A leg swinging down regenerates into the bus, and without this the rail overshoots. Surface mount so it lives on the copper side — a 16 mm radial part will not fit the 5.5 mm gap on the plain side.',
'Capacitor 10 µF':'Rail decoupling either side of the regulator, plus one at the MCU. MLCC rather than tantalum: no polarity to get wrong, no short-circuit failure mode, milliohm ESR.',
'Crystal 8 MHz X49SM8MSD2SC':'Gives the G431 a timebase accurate enough for CAN. The internal oscillator is plus or minus one percent and CAN wants better than half of that, so on a multi-node bus the crystal is the difference between a reliable link and intermittent frame errors.',
'Capacitor 30 pF':'Load capacitors that make the crystal oscillate at its rated frequency. Must be C0G or NP0 — X7R drifts with temperature and pulls the frequency off, which defeats the whole reason for fitting a crystal.',
'Capacitor 100 nF':'High-frequency decoupling. One at every supply pin, one at each analog reference, one across the 19 V bus, and filters on the NTC and divider inputs. Fourteen per board, which is more than most people expect.',
'Capacitor 1 µF':'Bulk on the analog supply and the ADC voltage reference. Keeps the current measurement quiet when the motor is switching.',
'Resistor 10k':'Boot0 pull-down so the chip runs your firmware rather than the bootloader, the enable pull-down that keeps motors off when nothing is driving it, and the three node ID jumpers.',
'Resistor 0 Ω jumper':'On a single copper layer two nets that must cross have nowhere to go. A zero ohm resistor hops one over the other. Budget eight per board; if you need more than fifteen the placement is wrong.',
'Resistor 120 Ω':'Terminates the CAN bus at its two physical ends so signals do not reflect. The same value doubles as the LED series resistor at 7.5 mA, so you are not buying a second part.',
'LED red XL-3216SURC':'Status. Firmware alive, faulted, calibrating. On a board with no display it is the only thing that tells you the node is running before you attach a debugger.',
'JST-XH 3-pin male':'Motor phases A, B and C. Keyed so you cannot reverse it, and in a board corner where there is height clearance beside the gearbox.',
'JST-XH 5-pin male':'The bus connector, two per board so nodes daisy-chain. Carries CANH, CANL, the hardware kill line, 5 V and ground. In and ext are the same signals — the labels are only for tracing the chain.',
'JST-VH 2-pin male':'19 V into the node. VH is a heavier family than XH, which is overkill for the current but keeps every crimp on one tool.',
'Berg strip 2.54 male':'Snapped into a six-pin piece for the driver and a five-pin piece for SWD. Cheaper and more flexible than buying the exact lengths.',
'SMT female header 2.54':'The socket the driver plugs into, surface mounted on the copper side. Makes the driver swappable instead of soldered, which matters the first time you kill one.',
'Copper clad 7.6×10 FR4':'The board itself. Two nodes fit on one sheet. Glass epoxy rather than paper phenolic — phenolic delaminates when drilled and chars under an iron.',
'ESP32-S3 Super Mini':'The arm controller. Fuses the sensors, runs the behaviour state machine, decides joint targets at 200 Hz and pushes them onto the CAN bus. Also the USB link to a PC when one is attached.',
'DC barrel jack 5.5×2.1':'Power input from a 19 V laptop brick. The brick is fixed output rather than a USB-C PD profile, so there is nothing to negotiate — it goes straight to the bus.',
'P-mosfet SI2301 class':'Reverse polarity protection on that barrel jack. USB-C PD would have given this for free; a bare jack gives you nothing, and a wrong-polarity moment would take out three MCUs.',
'MP1584EN buck':'One converter in the base makes the 5 V that every node, the sensors and the head all run from. Putting it here instead of on each node saved board area and three parts.',
'2N7000':'The hardware kill. Pulls every driver enable pin low the instant the controller says so, or the moment it stops running. Never route an emergency stop through a software bus.',
'Resistor 2k2':'I2C pull-ups for the long run up the arm to the head. At the controller end only — the head module brings none of its own.',
'VL53L5CX ToF imager':'An 8 by 8 depth image. Gives proximity, hand-wave gestures and desk-edge detection with no vision pipeline at all, which is why it is the highest-value sensor on the list. Now lives on the head module, on the C3 own I2C bus rather than a long run down the arm.',
'INMP441 mic':'Two of them, 130 mm apart on the base, sampled synchronously over one I2S bus. That spacing is what turns two microphones into a bearing, so the robot can turn toward whoever spoke.',
'MPR121 touch':'Twelve capacitive pads over I2C, which means twelve touch zones for zero extra GPIO. Copper tape inside the shell reads fine through 1.5 mm of PLA.',
'IMU':'Sits in the base and reads what the world does to the robot — picked up, tilted, bumped. In the head it would read the arm own motion instead, which is a different and less useful measurement.',
'Copper foil tape':'The touch pads themselves, stuck to the inside of the shell.',
'ESP32-C3 Super Mini':'Runs the head as a self-contained module and as the fourth node on the CAN bus — the C3 has its own TWAI controller, so it needs only a transceiver, exactly like a joint node. The controller writes an intent like listening or alert; the C3 renders the animation, drives the ears and moves the servos without the controller knowing about frames. Putting it on CAN rather than a long I2C run removed the most fragile wire in the robot, and freed its single I2C peripheral to drive the depth imager locally.',
'SmartElex 1.69 in TFT':'The face. Two eyes that blink, saccade and squint, coupled to where the head is looking so the gaze reads as intentional.',
'WS2812B':'The ear lights. One data pin drives both, chained. Colour and animation carry emotional state alongside the screen.',
'SG90 servo':'Head pan and tilt. Pan matters because base yaw swings the whole arm — with the gripper positioned over work the robot could not look elsewhere without abandoning the task.',
'MAX98357A + 8 Ω speaker':'Sound, sharing the same I2S bus as the microphones. The cheapest personality upgrade left, and it costs no pins you have not already allocated.',
'2804 gimbal motor':'The joint itself. High pole count and 9 to 15 Ω windings give torque at zero speed, which is what a robot joint needs. A drone motor would trip overcurrent instantly.',
'Bearing 608ZZ':'Sits on each eccentric cam journal so the cycloid disc can orbit while spinning freely relative to the cam. Ordinary skateboard bearings — the eccentricity is in the printed cam, not the bearing.',
'Bearing 626ZZ':'Three of them at 120 degrees carry the gearbox output plate in a printed race. Replaces a single large thin-section bearing, which India does not stock.',
'Dowel 3×16 hard':'The ring pins the cycloid lobes roll against. Ø3.0 exactly, because that radius is baked into the profile equation — a 3.2 mm spring pin would need the discs regenerated.',
'Dowel 3×12 hard':'Press into the output plate and pass through oversized holes in both discs. This is what converts the discs orbiting motion into pure rotation at the output.',
'M3×40 socket + nut':'Four of these clamp the cap to the housing and simultaneously serve as ring pins at four of the sixteen positions. That trick is what keeps the actuator at 48 mm with no mounting ears.',
'M3×10 socket':'Bolts the output flange to the next link in the arm.',
'M2 and M2.5 ×6 screws':'Hold the eccentric cam to the rotor and the motor to the housing. Buy both sizes — you will not know which the motor uses until it arrives, and it is the one part that stops assembly dead.',
'M3 heat-set insert':'Threads in printed plastic that survive being undone more than twice.',
'M8 nut counterweight':'Sits behind the shoulder axis so the arm balances. A balanced shoulder draws almost no current holding a pose, which is what keeps the PLA housing below its softening point.',
'PLA+ filament':'Housing, cap, two discs, cam and output plate. About 45 g per actuator.',
'Lithium grease':'Cycloid discs and ring pins. Run each gearbox in for ten minutes before loading it.',
'Ferric chloride':'Etchant. Everything not protected by toner dissolves away.',
'ST-Link V2':'Programs and debugs the G431 over SWD. Without it a bare chip has no firmware and no way to get any.',
'Silicone wire 22 AWG 5 m':'Power runs, threaded through the hollow motor shafts. Silicone because it stays flexible where solid-core would fatigue and break.',
'Silicone wire 28 AWG 5 m':'Signal runs. Twist each pair with its own ground return, not all four together.',
'Ferrite clips':'On the I2C run to the head and the camera cable. Motor return current and signal ground share a net, and this is the cheap fix for what that couples in.',
'JST crimp tool':'Thirty-nine terminals with pliers gives crimps that fail under vibration, which is exactly what a moving arm supplies. This is not an optional tool.',
'XH crimp terminals':'The metal contacts that crimp onto each wire and clip into the housings. Thirty-nine needed; buy a hundred because the first dozen teach you how.',
'XH housings 3 and 5 pin':'The cable side of every connector. Board headers on their own connect to nothing.'
};

 ['Why one motor per MCU','Three motors on one LQFP-48 G431 gives five hard pin collisions: PA1 and PA2 (motor 3 PWM against OPAMP1), PB6 and PB7 (motor 2 PWM against I2C1), PB8 (motor 2 PWM against FDCAN RX). One motor per MCU is collision-free at 18 pins, deletes the I2C multiplexer, and shortens the encoder cable from 400 mm to 15 mm.'],
 ['Why INA240A1 and not A2','With a 30 mΩ shunt, A1 at 20 V/V gives 0.6 V/A and ±2.75 A full scale, which matches the Mini 2.5 A ceiling. A2 at 50 V/V clips at 1.1 A and you lose the top half of the range.'],
 ['Why inline sensing','A shunt in the driver ground reads bus current, not phase current, and SimpleFOC needs two phase currents. The G431 internal op-amps cannot do inline because a phase wire swings 0 to 19 V at 20 kHz, far outside their common-mode range.'],
 ['Why the crystal is not optional','The G431 HSI is ±1%. CAN bit timing wants better than ±0.5%. On a multi-node bus the internal oscillator produces intermittent frame errors that are miserable to debug.'],
 ['Why C0G on the 30 pF only','X7R drifts several percent with temperature and voltage, detuning the crystal and defeating the reason it is fitted. C0G costs the same at 30 pF — you just have to ask for it.'],
 ['Why the copper side faces air','Every SMD part cools into open air, motor heat rises away from the board, and the encoder solders as an ordinary through-hole part with its body on the plain side facing the magnet.'],
 ['Why all through-hole sits in the corners','The plain side has only a 5.5 mm ceiling under the Ø48 gearbox. The board corners project 9.6 mm past that circle, where height is unlimited.'],
 ['Why head pan came back','Base yaw moves the whole arm, so with the gripper positioned over work it cannot look elsewhere. Head pan decouples looking from positioning, swings 85 g instead of 700 g, and costs a net 9 g once the wrist tilt is deleted.'],
 ['Why mics and IMU live in the base','On a moving head, sound bearings would need transforming through three joint angles every frame. An IMU in the head reads the arm own motion; in the base it reads only what the world does.'],
 ['The number behind everything','A 2804 makes 0.06 N·m. That drove the gearbox, the link lengths, the spring debate and the decision to keep the arm short. Every mechanical argument traces back to it.'],
 ['Why CAN lands on GPIO 3 and 10 on the head','The ESP32-C3 has a TWAI controller — Espressif naming for CAN 2.0 — so it joins the bus directly with nothing but a transceiver. But GPIO 2, 8 and 9 are boot straps, and GPIO 9 held low at reset puts the chip in download mode. A transceiver RX pin sees a dominant bus bit as a low. Put CAN there and the head silently fails to boot whenever it is plugged into a bus that happens to be busy, which is exactly what hot-plugging means. GPIO 3 and 10 have no boot function.'],
 ['Why the head moved onto CAN','It was on a 400 mm I2C run up a moving arm, next to three motor phases — the weakest link in the system. Putting the ESP32-C3 on the same CAN bus as the joints costs one transceiver, uses the identical five-pin cable, and inherits the same watchdog. It also freed the C3 single I2C peripheral, which had been blocking the depth imager.'],
 ['Rejected, so you do not re-derive them','SCARA — no vertical head motion. One G474 in LQFP-64 — 16 pins per side cannot escape on one layer. Belts and capstan — parts already ordered, but belt stays the fallback if backlash exceeds 2°. L6234PD — exposed thermal slug. LM358 — input range excludes ground. Tantalum 10 µF — fails short. Three radial 470 µF — rejected on voltage or height.']];

/* donut arc */
function donut(pct,label,sub,color){
  const r=34,c=2*Math.PI*r,off=c*(1-pct);
  return `<svg viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="${esc(label)} ${Math.round(pct*100)} percent">
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="#DEDCD5" stroke-width="9"/>
    <circle cx="48" cy="48" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 48 48)" stroke-linecap="butt"/>
    <text x="48" y="45" text-anchor="middle" font-size="19" font-weight="600" fill="#15171B">${sub}</text>
    <text x="48" y="60" text-anchor="middle" font-size="10" fill="#5A6170">${esc(label)}</text></svg>`;
}

/* dependency map */
function depMap(){
  const col={A:0,B:1,C:2,D:3,E:4};
  const byStage={};STAGE_ORDER.forEach(s=>byStage[s]=CHUNKS.filter(c=>c.s===s));
  const W=1120,rowH=46,pad=14;
  const maxRows=Math.max(...STAGE_ORDER.map(s=>byStage[s].length));
  const H=maxRows*rowH+64;
  const colW=W/5;
  let pos={};
  let out='';
  STAGE_ORDER.forEach(s=>{
    const x=col[s]*colW+pad;
    out+=`<text x="${x}" y="18" font-size="11.5" font-weight="600" fill="#5A6170">${s} · ${esc(STAGES[s])}</text>`;
    byStage[s].forEach((c,i)=>{
      const y=34+i*rowH;
      pos[c.id]={x:x,y:y,w:colW-pad*2,h:34};
    });
  });
  // edges first
  let edges='';
  CHUNKS.forEach(c=>c.dep.forEach(d=>{
    const a=pos[d],b=pos[c.id]; if(!a||!b) return;
    const x1=a.x+a.w,y1=a.y+17,x2=b.x,y2=b.y+17;
    const mx=(x1+x2)/2;
    edges+=`<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="#C9C7C0" stroke-width="1.3"/>`;
  }));
  out=edges+out;
  CHUNKS.forEach(c=>{
    const p=pos[c.id]; const isDone=S.chunks[c.id]; const isNext=nextChunk()&&nextChunk().id===c.id;
    const fill=isDone?'#E5F0E9':(isNext?'#E5EDF8':'#FBFBF9');
    const stroke=isDone?'#2C6A4E':(c.f==='gate'?'#A32D2D':(c.f==='crit'?'#1B4B8F':(c.f==='decision'?'#9C6B14':'#C9C7C0')));
    out+=`<g class="clickable" data-goto="${c.id}">
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${fill}" stroke="${stroke}" stroke-width="${isNext?2:1}"/>
      <rect x="${p.x}" y="${p.y}" width="4" height="${p.h}" fill="${stroke}"/>
      <text x="${p.x+12}" y="${p.y+15}" font-size="10.5" font-weight="600" fill="${isDone?'#2C6A4E':'#1B4B8F'}">${c.id}</text>
      <text x="${p.x+12}" y="${p.y+27}" font-size="11" fill="#15171B">${esc(c.t.length>26?c.t.slice(0,25)+'…':c.t)}</text>
      ${isDone?`<text x="${p.x+p.w-12}" y="${p.y+22}" font-size="13" text-anchor="end" fill="#2C6A4E">✓</text>`:''}
    </g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:${H}px">${out}</svg>`;
}

function renderRun(){
  const el=$('#t-run'); el.innerHTML='';
  STAGE_ORDER.forEach(st=>{
    const list=CHUNKS.filter(c=>c.s===st), d=list.filter(c=>S.chunks[c.id]).length;

    h.innerHTML=`<h3>Stage ${st} — ${esc(STAGES[st])}</h3><span class="mono" style="color:var(--graphite);font-size:12.5px">${d}/${list.length}</span>`;
    el.appendChild(h);
    list.forEach(c=>{
      const blocked=!ready(c)&&!S.chunks[c.id];
      const d2=document.createElement('div');
      d2.id='ck-'+c.id;
      d2.className='chunk '+(S.chunks[c.id]?'done ':'')+c.f;

      d2.innerHTML=`
      <div class="ctop" tabindex="0" role="button" aria-expanded="false">
        <input type="checkbox" ${S.chunks[c.id]?'checked':''} aria-label="mark ${c.id} done">
        <span class="cid mono">${c.id}</span>
        <h4>${esc(c.t)}</h4>

      </div>`;
      const top=$('.ctop',d2),cb=$('input',d2),ta=$('textarea',d2);

      top.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();top.click();} };
      cb.onchange=()=>{
        S.chunks[c.id]=cb.checked;
        if(!S.started) S.started=new Date().toISOString();
        addLog((cb.checked?'Completed ':'Reopened ')+c.id+' — '+c.t, true);
        save(); renderAll();
      };
      ta.oninput=()=>{ S.notes[c.id]=ta.value; save(); };
      el.appendChild(d2);
    });
  });
}

const ORD_STATUS=['Placed','Shipped','Arrived','Partly arrived','Problem','Cancelled'];
function okey(o){ return 'o'+o.n; }
function oget(o,f,def){
  const e=(S.ordEdit||{})[okey(o)];
  return (e && e[f]!==undefined && e[f]!=='') ? e[f] : def;
}
function oset(o,f,v){
  S.ordEdit=S.ordEdit||{};
  const k=okey(o); S.ordEdit[k]=Object.assign({},S.ordEdit[k],{[f]:v}); save();
}
function oedited(o){
  const e=(S.ordEdit||{})[okey(o)];
  return e && Object.keys(e).some(k=>e[k]!=='' && e[k]!==undefined);
}
function orow(o){
  if(o._i!==undefined){                       // a user-added order owns its fields outright
    const x=S.ordAdd[o._i]||{};
    return {v:x.v||'', id:x.id||'', u:x.u||'', w:x.w||'',
            amt:x.amt||'', placed:x.placed||'', note:x.note||''};
  }
  return {v:oget(o,'v',o.v), id:oget(o,'id',o.id), u:oget(o,'u',o.u),
          w:oget(o,'w',o.w), amt:oget(o,'amt',''), placed:oget(o,'placed',''),
          note:oget(o,'note','')};
}
function customOrders(){
  return (S.ordAdd||[]).map((x,i)=>Object.assign({n:'C'+(i+1),_i:i},x));

    gb.appendChild(d2);
  });
}

/* ---- user-editable overrides for any BOM line ---- */
function bkey(r){ return r[2]+'|'+r[1]; }
function bget(r,i,def){
  const o=(S.bomEdit||{})[bkey(r)];
  return (o && o[i]!==undefined && o[i]!=='') ? o[i] : def;
}
function bset(r,i,v){
  S.bomEdit=S.bomEdit||{};
  const k=bkey(r); S.bomEdit[k]=Object.assign({},S.bomEdit[k],{[i]:v});
  save();
}
function bedited(r){
  const o=(S.bomEdit||{})[bkey(r)];
  return o && Object.keys(o).some(k=>o[k]!=='' && o[k]!==undefined);
}
/* a row's effective values, overrides applied */
function brow(r){
  return {part:bget(r,'part',r[2]), ref:bget(r,'ref',r[3]),
          per:parseFloat(bget(r,'per',r[4])), shared:parseFloat(bget(r,'shared',r[5])),
          price:parseFloat(bget(r,'price',r[6])), pkg:bget(r,'pkg',r[7]),
          type:bget(r,'type',r[8]), vendor:bget(r,'vendor',r[9]),
          use:bget(r,'use',USE[r[2]]||''), url:bget(r,'url',''), note:bget(r,'note','')};
}
const VENDORS=['Robu','Evelta','Sharvi','Omrook','Robocraze','Ktron','LCSC','Mouser','AliExpress','Amazon','local','owned','—'];

/* ---- user-added lines, kept alongside the built-in BOM ---- */
function customRows(){
  return (S.bomAdd||[]).map((x,i)=>[x.scope||'robot', x.group||'Custom', x.part||'New part',
    x.ref||'—', +x.per||0, +x.shared||0, +x.price||0, x.pkg||'—', x.type||'', x.vendor||'Robu', i]);
}
function addCustom(){
  S.bomAdd=S.bomAdd||[];
  S.bomAdd.push({scope:S.bomScope==='node'?'node':'robot',group:'Custom',part:'New part',
                 ref:'—',per:0,shared:1,price:0,pkg:'—',type:'',vendor:'Robu'});
  logAction('action','Added a custom part line');
  save(); renderBom();
}
function delCustom(i){
  if(!confirm('Delete this custom line?')) return;
  S.bomAdd.splice(i,1); logAction('action','Deleted a custom part line'); save(); renderBom();
}

  const groups=[...new Set(rows.map(r=>r[1]))];
  let est=0,paid=0,have=0,edited=0;
  rows.forEach(r=>{const b=brow(r),q=qtyOf(r); est+=q*b.price;

      <span style="font-size:12.5px;color:var(--graphite)">

      <div style="height:6px;background:#DEDCD5;margin-top:7px"><div style="height:6px;background:var(--copper);width:${est?Math.min(100,paid/est*100):0}%"></div></div></div>
  </div>
  <div id="bb"></div>`;

  el.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.bomScope=b.dataset.scope;save();renderBom();});
  $('#nc',el).onchange=e=>{S.nodeCount=Math.max(1,Math.min(8,parseInt(e.target.value)||3));save();renderBom();renderHeader();};
  $('#addRow',el).onclick=addCustom;
  const re=$('#resetEdits',el);

    S.bomEdit={}; logAction('action','Reset all part edits'); save(); renderBom(); };

  const bb=$('#bb',el);

    const tb=$('tbody',tbl);
    gr.forEach(r=>{
      const b=brow(r), key=bkey(r), st=S.bom[key]||{}, q=qtyOf(r), line=q*b.price;

      const cb=$('input[type=checkbox]',tr), np=$('input[type=number]',tr);

      np.oninput=()=>{S.bom[key]=Object.assign({},S.bom[key],{paid:np.value});save();renderHeader();};
      tb.appendChild(tr);

      const det=document.createElement('tr'); det.className='bomdet'; det.hidden=true;
      const f=(lab,id,val,w)=>`<div class="field" style="margin-bottom:8px;${w?'width:'+w:''}">

      det.innerHTML=`<td></td><td colspan="9" style="background:#F6F5F1;padding:14px 14px 16px">
        <div class="grid g3" style="gap:12px">
          <div>
            ${f('Part name','part',b.part)}
            ${f('Reference','ref',b.ref)}
            ${f('Package','pkg',b.pkg)}
          </div>
          <div>
            <div class="field" style="margin-bottom:8px"><label class="fl">Vendor</label>
              <select data-f="vendor">${VENDORS.concat(VENDORS.includes(b.vendor)?[]:[b.vendor]).map(v=>

            ${f('Per node','per',b.per)}

        </div>
        <div class="field" style="margin-top:4px"><label class="fl">What it does, and why it is here</label>
          <textarea data-f="use" style="min-height:64px">${esc(b.use)}</textarea></div>
        <div class="field"><label class="fl">Your notes — substitutions, stock, what actually arrived</label>
          <textarea data-f="note" style="min-height:52px">${esc(b.note)}</textarea></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          ${b.url?`<a class="act" style="text-decoration:none;padding:6px 12px" href="${esc(b.url)}" target="_blank" rel="noopener">Open listing</a>`:''}
          ${bedited(r)?'<button class="act" data-a="revert">Revert to shipped values</button>':''}
          ${isCustom?'<button class="act danger" data-a="del">Delete this line</button>':''}

      tb.appendChild(det);

      det.querySelectorAll('[data-f]').forEach(inp=>{
        const fld=inp.dataset.f;
        const commit=()=>{
          if(isCustom){
            const rec=S.bomAdd[r[10]];
            rec[fld]=inp.value; save();
          } else bset(r,fld,inp.value);
        };
        inp.oninput=commit;
        inp.onchange=commit;
        inp.onblur=()=>{ logDebounced('action','Edited part: '+b.part); renderBom(); };
      });
      const rv=det.querySelector('[data-a=revert]');
      if(rv) rv.onclick=()=>{ delete S.bomEdit[key]; logAction('action','Reverted '+b.part); save(); renderBom(); };
      const dl=det.querySelector('[data-a=del]');
      if(dl) dl.onclick=()=>delCustom(r[10]);
    });
    bb.appendChild(tbl);
  });
}

function renderMsr(){
  const el=$('#t-msr');
  const a=n=>(S.answers[n]||'');
  // derived
  const T=parseFloat(a(10)), P=parseFloat(a(5));
  const gap=(!isNaN(T))?(T-(isNaN(P)?2:P)-2.5):null;
  const bl=parseFloat(a(17));
  el.innerHTML=`<div class="panel"><h3>What the numbers mean once you have them</h3>
    <div class="grid g3">
      <div class="out ${gap===null?'':(gap>=0.5&&gap<=2?'good':'warn')}">
        <div style="font-size:12.5px;color:var(--graphite)">Encoder gap</div>
        <b class="mono">${gap===null?'—':gap.toFixed(2)+' mm'}</b>
        <div style="font-size:12.5px">wants 0.5 to 2.0. Verify with MD alone on STATUS</div></div>
      <div class="out ${isNaN(bl)?'':(bl<1?'good':(bl>2?'warn':''))}">
        <div style="font-size:12.5px;color:var(--graphite)">Tip error from backlash</div>
        <b class="mono">${isNaN(bl)?'—':(bl*Math.PI/180*300).toFixed(1)+' mm'}</b>
        <div style="font-size:12.5px">at 300 mm reach. Under 1° gear both joints</div></div>
      <div class="out">
        <div style="font-size:12.5px;color:var(--graphite)">Blocking answers</div>
        <b class="mono">${5-blockersOpen()}/5</b>
        <div style="font-size:12.5px">measure these the day the motors land</div></div>
    </div></div>
    <div id="qb"></div>`;
  const qb=$('#qb',el);
  QUESTIONS.forEach(q=>{
    const v=S.answers[q.n]||'';
    const d=document.createElement('div');
    d.className='q'+(v.trim()?' filled':(q.b?' blocking':''));
    d.innerHTML=`<div class="qh"><span class="qn mono">${q.n}</span><span class="qt">${esc(q.q)}</span>
      ${q.b?'<span class="flag gate">blocking</span>':''}</div>
      <div class="qm">${esc(q.h)}${MSR2TEST[q.n]?' <span class="chip" style="border-color:var(--blue);color:var(--blue)">also recorded by test '+MSR2TEST[q.n]+'</span>':''}</div>
      <div class="qi" style="display:flex;gap:8px;align-items:center">
        <input type="text" value="${esc(v)}" placeholder="answer">
        ${q.u?'<span class="mono" style="color:var(--graphite);font-size:13px">'+q.u+'</span>':''}</div>`;
    const inp=$('input',d);
    const before=v;
    inp.oninput=()=>{S.answers[q.n]=inp.value;save();renderHeader();};
    inp.onblur=()=>{ if(inp.value!==before && inp.value.trim())
        logAction('action','Measured #'+q.n+' '+q.q+' = '+inp.value);
      save(); renderMsr(); renderTools(); renderTest(); renderHeader(); };
    qb.appendChild(d);
  });
}

/* ---- calculators ---- */
const CALCS=[
 {t:'Encoder gap from spacer',why:'The spacer is the only variable once the encoder is soldered flush. Chip sits ~2.5 mm above the board. Defaults come from your Measurements tab.',
  f:[['Spacer thickness T','mm',5.5,10],['Magnet protrusion','mm',2.0,5],['Chip height above board','mm',2.5]],
  run:v=>{const g=v[0]-v[1]-v[2];return {v:g.toFixed(2)+' mm gap',ok:g>=0.5&&g<=2.0,
    note:g<0.5?'Too close — MH will set. Use a thicker spacer.':(g>2?'Too far — ML will set. Thinner spacer.':'In range. Confirm MD alone on the STATUS register.')};}},
 {t:'Shoulder torque and reach',why:'Every mechanical argument in this project comes back to this. Direct drive is 0.06 N·m; geared is 0.7.',
  f:[['Link length','mm',150],['Head mass','g',85],['Elbow actuator mass','g',110]],
  run:v=>{const L=v[0]/1000,t=9.81*L*(0.015+v[2]/1000+0.06+v[1]/1000*2);
    return {v:t.toFixed(3)+' N·m',ok:t<0.7,
      note:t>0.7?'Over the geared limit of 0.7 N·m. Shorten links or lighten the head.':(t>0.06?'Needs the gearbox. Direct drive tops out at 0.06 N·m.':'Within direct drive.')};}},
 {t:'INA240 full scale',why:'Shunt and gain together set how much current you can read before clipping. The Mini tops out at 2.5 A.',
  f:[['Shunt','mΩ',30],['Gain','V/V',20],['Rail','V',3.3]],
  run:v=>{const vpa=v[0]/1000*v[1],fs=(v[2]/2)/vpa;
    return {v:'±'+fs.toFixed(2)+' A · '+vpa.toFixed(2)+' V/A',ok:fs>=2.5,
      note:fs<2.5?'Clips before the driver limit. Lower the gain or the shunt.':'Covers the full driver range.'};}},
 {t:'LED series resistor',why:'You already have 120 Ω on the board for CAN termination, and it doubles as the LED resistor.',
  f:[['Rail','V',3.3],['LED forward','V',2.4],['Target current','mA',7.5]],
  run:v=>{const r=(v[0]-v[1])/(v[2]/1000);
    return {v:Math.round(r)+' Ω',ok:true,note:'Nearest on the board: 120 Ω gives '+(((v[0]-v[1])/120)*1000).toFixed(1)+' mA, 1k gives '+(((v[0]-v[1])/1000)*1000).toFixed(1)+' mA.'};}},
 {t:'Vbus divider',why:'5% resistors are fine here — calibrate the ratio in firmware against a meter instead of buying tolerance.',
  f:[['R top','kΩ',100],['R bottom','kΩ',4.7],['Bus','V',19]],
  run:v=>{const rat=v[1]/(v[0]+v[1]),vo=v[2]*rat;
    return {v:vo.toFixed(3)+' V at the pin',ok:vo<3.3,
      note:vo>3.3?'Over the ADC range. Increase the top resistor.':'Ratio '+rat.toFixed(5)+'. ADC counts at 12 bit: '+Math.round(vo/3.3*4095)+'.'};}},
 {t:'Crystal load caps',why:'Wrong load caps pull the frequency off, which defeats the reason for fitting a crystal.',
  f:[['Crystal load CL','pF',20],['Stray per pin','pF',5]],
  run:v=>{const c=2*(v[0]-v[1]);
    return {v:c+' pF each',ok:true,note:'Must be C0G / NP0. X7R drifts several percent and detunes the oscillator.'};}},
 {t:'Cycloid ratio and torque',why:'Ratio is pins minus one. Efficiency is whatever you measured in test T24.',
  f:[['Ring pins','',16],['Motor torque','N·m',0.06],['Efficiency','%',75,18]],
  run:v=>{const r=v[0]-1,t=v[1]*r*v[2]/100;
    return {v:r+':1 · '+t.toFixed(3)+' N·m out',ok:true,
      note:'Eccentricity must stay under R/N. At R19 and '+v[0]+' pins that is '+(19/v[0]).toFixed(2)+' mm.'};}},
 {t:'Backlash at the tip',why:'This is the number that decides whether a gripper is worth adding. Backlash is whatever you recorded in test T23.',
  f:[['Backlash','deg',1.5,17],['Reach','mm',300]],
  run:v=>{const e=v[0]*Math.PI/180*v[1];
    return {v:e.toFixed(1)+' mm at the tip',ok:v[0]<1,
      note:v[0]>2?'Over 2° — switch to GT2 belts, about ₹800 of parts.':(v[0]<1?'Under 1° — gear both joints.':'Borderline. Fine for pointing, not for small parts.')};}},
 {t:'CAN bus load',why:'Sanity check before adding joints. Classic 8-byte frame is about 130 µs at 1 Mbps.',
  f:[['Nodes','',3],['Frames per node','',2],['Rate','Hz',200]],
  run:v=>{const f=v[0]*v[1]*v[2],load=f*130e-6*100;
    return {v:Math.round(f)+' frames/s · '+load.toFixed(0)+'% load',ok:load<60,
      note:load>60?'Too high. Split into two buses or move to FDCAN.':'Comfortable. Room for more joints.'};}},
 {t:'PWM timer period',why:'TIM1 centre aligned at 170 MHz. Feed this into CubeMX.',
  f:[['Clock','MHz',170],['Target PWM','kHz',20]],
  run:v=>{const p=Math.round(v[0]*1e6/(v[1]*1000)/2)-1;

    <div class="grid g2" id="cb"></div>`;
  const cb=$('#cb',el);
  CALCS.forEach((c,ci)=>{
    const d=document.createElement('div'); d.className='calc';
    d.innerHTML=`<h4>${esc(c.t)}</h4><div class="why">${esc(c.why)}</div>
      ${c.f.map((f,i)=>{const m=(f[3]!==undefined)?msr(f[3],null):null;
        return `<div class="field"><label class="fl">${esc(f[0])}${f[1]?' ('+f[1]+')':''}${
          m!==null?' <span class="chip" style="border-color:var(--done);color:var(--done)">measured</span>':
          (f[3]!==undefined?' <span class="chip">from measurement #'+f[3]+'</span>':'')}</label>
        <input type="number" step="any" data-i="${i}" value="${m!==null?m:f[2]}"></div>`;}).join('')}
      <div class="out" data-out></div>`;
    const ins=[...d.querySelectorAll('input')], out=$('[data-out]',d);
    const run=()=>{
      const v=ins.map(i=>parseFloat(i.value)||0);

      out.innerHTML=`<b class="mono">${esc(r.v)}</b><div style="font-size:13px;margin-top:3px">${esc(r.note)}</div>`;

    ins.forEach(i=>i.oninput=run); run();
    cb.appendChild(d);
  });
}

function addLog(text,auto){ logAction(auto?'auto':'note',text); }
function logAction(kind,text){
  if(typeof LIVE!=='undefined' && LIVE) return;      // do not log while browsing a snapshot
  S.log=S.log||[];
  S.log.unshift({t:new Date().toISOString(),x:text,k:kind});
  if(S.log.length>800) S.log.length=800;
}
let _lt=null;
function logDebounced(kind,text,ms){
  clearTimeout(_lt);
  _lt=setTimeout(()=>{logAction(kind,text);save();}, ms||1500);
}
function renderLog(){
  const el=$('#t-log');
  const f=S.logFilter||'all';
  const KIND={note:['note','#1B4B8F'],auto:['progress','#2C6A4E'],action:['action','#5A6170'],version:['version','#9C6B14']};
  el.innerHTML=`<div class="panel"><h3>Add an entry</h3>
    <textarea id="lgIn" placeholder="What you did, what broke, what you measured"></textarea>
    <div style="margin-top:8px"><button class="act" id="lgAdd">Add to log</button></div></div>
    <div class="panel"><h3>History</h3>
      <div style="display:flex;gap:0;border:1px solid var(--rule);width:max-content;margin-bottom:12px" id="lgF">
        ${[['all','Everything'],['note','My notes'],['auto','Progress'],['action','Actions'],['version','Versions']].map(x=>
        `<button class="act" data-f="${x[0]}" style="border:0;border-right:1px solid var(--rule);
          background:${f===x[0]?'var(--bluep)':'#fff'};font-weight:${f===x[0]?600:400}">${x[1]}</button>`).join('')}
      </div>
      <div id="lgList"></div></div>`;
  $('#lgAdd',el).onclick=()=>{
    const v=$('#lgIn',el).value.trim(); if(!v) return;
    logAction('note',v); save(); renderLog();
  };
  el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.logFilter=b.dataset.f;save();renderLog();});
  const L=$('#lgList',el);
  const items=(S.log||[]).filter(e=>f==='all'||(e.k||'note')===f);
  if(!items.length){ L.innerHTML='<div style="color:var(--graphite);font-size:13.5px">Nothing here yet. Checking off a chunk, marking a part in hand or saving a version all write entries automatically.</div>'; return; }
  L.innerHTML=items.map(e=>{
    const k=KIND[e.k||'note']||KIND.note;
    return `<div class="logent" style="border-left-color:${k[1]}">
      <div class="logdate mono">${new Date(e.t).toLocaleString()} <span class="chip" style="border-color:${k[1]};color:${k[1]}">${k[0]}</span></div>
      <div style="font-size:14px;white-space:pre-wrap">${esc(e.x)}</div></div>`;
  }).join('');
}

/* ---------- package renderers ---------- */
function pinName(k,i,def){ const o=(S.pins[k]||{})[i]; return (o&&o.n!==undefined&&o.n!=='')?o.n:def; }
function pinFunc(k,i,def){ const o=(S.pins[k]||{})[i]; return (o&&o.f!==undefined)?o.f:def; }
function setPin(k,i,field,v){ S.pins[k]=S.pins[k]||{}; S.pins[k][i]=Object.assign({},S.pins[k][i],{[field]:v}); save(); }

function svgQuad(p){
  const per=p.perSide, B=210, L=110, pad=16, S0=B/(per+1);
  const W=B+L*2+pad*2, ox=L+pad, oy=L+pad;
  let o=`<rect x="${ox}" y="${oy}" width="${B}" height="${B}" fill="#2C2E33" stroke="#15171B"/>`;
  o+=`<circle cx="${ox+18}" cy="${oy+18}" r="6.5" fill="none" stroke="#EFEEE9" stroke-width="1.6"/>`;
  o+=`<text x="${ox+B/2}" y="${oy+B/2-4}" text-anchor="middle" fill="#EFEEE9" font-size="14" font-weight="600">STM32G431</text>`;
  o+=`<text x="${ox+B/2}" y="${oy+B/2+13}" text-anchor="middle" fill="#9BA1AC" font-size="11">CBT6 · LQFP-48</text>`;
  const draw=(i,x1,y1,x2,y2,tx,ty,anchor,rot)=>{
    const num=i+1, pr=p.pins[i]||[num,'',''];
    const nm=pinName(p.k,num,pr[1]), fn=pinFunc(p.k,num,pr[2]);
    const isPwr=/^(V|GND)/.test(nm)||nm==='NRST';
    const col=fn?'#1B4B8F':(isPwr?'#8A8F9A':'#5A6170');
    o+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${fn?2.2:1.4}"/>`;
    o+=`<text x="${tx}" y="${ty}" text-anchor="${anchor}" font-size="8.5" fill="${col}"
         ${rot?`transform="rotate(${rot} ${tx} ${ty})"`:''}>${num} ${esc(nm)}${fn?' · '+esc(fn.length>18?fn.slice(0,17)+'…':fn):''}</text>`;
  };
  for(let i=0;i<per;i++){                                  // 1-12 left, top to bottom
    const y=oy+S0*(i+1); draw(i, ox, y, ox-24, y, ox-28, y+3, 'end', 0);
  }
  for(let i=0;i<per;i++){                                  // 13-24 bottom, left to right
    const x=ox+S0*(i+1), idx=per+i;
    draw(idx, x, oy+B, x, oy+B+24, x+3, oy+B+28, 'start', 90);
  }
  for(let i=0;i<per;i++){                                  // 25-36 right, bottom to top
    const y=oy+B-S0*(i+1), idx=per*2+i;
    draw(idx, ox+B, y, ox+B+24, y, ox+B+28, y+3, 'start', 0);
  }
  for(let i=0;i<per;i++){                                  // 37-48 top, right to left
    const x=ox+B-S0*(i+1), idx=per*3+i;
    draw(idx, x, oy, x, oy-24, x-3, oy-28, 'end', -90);
  }
  return `<svg viewBox="0 0 ${W} ${W}" width="100%" style="max-width:470px">${o}</svg>`;
}

function svgDual(p,n3){
  const n=p.pins.length, per=n3?3:n/2, H=Math.max(90,per*30+30), Bw=104;
  const W=Bw+230, ox=115, oy=18, S0=H/(per+1);
  let o=`<rect x="${ox}" y="${oy}" width="${Bw}" height="${H}" rx="4" fill="#2C2E33" stroke="#15171B"/>`;
  o+=`<circle cx="${ox+15}" cy="${oy+15}" r="5" fill="none" stroke="#EFEEE9" stroke-width="1.5"/>`;
  o+=`<path d="M${ox+Bw/2-13} ${oy} a13 13 0 0 0 26 0" fill="none" stroke="#EFEEE9" stroke-width="1.4"/>`;
  o+=`<text x="${ox+Bw/2}" y="${oy+H/2}" text-anchor="middle" fill="#EFEEE9" font-size="11" font-weight="600">${esc(p.pkg)}</text>`;
  const one=(i,left)=>{
    const pr=p.pins[i], num=pr[0];
    const nm=pinName(p.k,num,pr[1]), fn=pinFunc(p.k,num,pr[2]);
    const row=left?i:(n-1-i);
    const y=oy+S0*((left?i:(n-1-i))%per+1);
    const x1=left?ox:ox+Bw, x2=left?ox-22:ox+Bw+22;
    const col=fn?'#1B4B8F':'#5A6170';
    o+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="2"/>`;

  };
  for(let i=0;i<per;i++) one(i,true);
  for(let i=per;i<n;i++) one(i,false);
  return `<svg viewBox="0 0 ${W} ${H+36}" width="100%" style="max-width:430px">${o}</svg>`;
}

function svgConn(p){
  const n=p.pins.length, pw=26, Bw=n*pw+16, H=54, ox=16, oy=22, W=Bw+270;
  let o=`<rect x="${ox}" y="${oy}" width="${Bw}" height="${H}" rx="3" fill="#EFEEE9" stroke="#15171B" stroke-width="1.4"/>`;
  o+=`<rect x="${ox+Bw/2-11}" y="${oy-6}" width="22" height="8" rx="2" fill="#EFEEE9" stroke="#15171B" stroke-width="1.4"/>`;
  o+=`<text x="${ox+Bw/2}" y="${oy-12}" text-anchor="middle" font-size="9" fill="#5A6170">key</text>`;
  p.pins.forEach((pr,i)=>{
    const cx=ox+8+pw*i+pw/2, num=pr[0];
    const nm=pinName(p.k,num,pr[1]), fn=pinFunc(p.k,num,pr[2]);
    o+=`<rect x="${cx-4}" y="${oy+12}" width="8" height="30" fill="#B0703A"/>`;
    o+=`<text x="${cx}" y="${oy+H+13}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${i===0?'#A32D2D':'#5A6170'}">${num}</text>`;
  });
  let ty=oy;
  p.pins.forEach((pr,i)=>{
    const num=pr[0], nm=pinName(p.k,num,pr[1]), fn=pinFunc(p.k,num,pr[2]);

function pinTable(p){
  let rows='';
  if(p.type==='module'){
    const mk=(arr,side)=>arr.map((pr,i)=>{
      const key=side+i, nm=pinName(p.k,key,pr[0]), fn=pinFunc(p.k,key,pr[1]);
      return `<tr class="${fn?'used':''}"><td class="pn">${side}${i+1}</td>
        <td class="pp"><input value="${esc(nm)}" data-k="${p.k}" data-i="${key}" data-f="n"></td>
        <td><input value="${esc(fn)}" data-k="${p.k}" data-i="${key}" data-f="f" placeholder="function"></td></tr>`;
    }).join('');
    rows=mk(p.left,'L')+mk(p.right,'R');
  }else{
    rows=p.pins.map(pr=>{
      const num=pr[0], nm=pinName(p.k,num,pr[1]), fn=pinFunc(p.k,num,pr[2]);
      const isPwr=/^(V|GND|—)/.test(nm);
      return `<tr class="${fn?'used':(isPwr?'pwr':'')}"><td class="pn">${num}</td>
        <td class="pp"><input value="${esc(nm)}" data-k="${p.k}" data-i="${num}" data-f="n"></td>
        <td><input value="${esc(fn)}" data-k="${p.k}" data-i="${num}" data-f="f" placeholder="function"></td></tr>`;
    }).join('');
  }
  return `<table class="pintbl"><tbody>${rows}</tbody></table>`;
}

function renderPin(){
  const el=$('#t-pin');
  el.innerHTML=`
  <div class="warnbox"><strong>Verify before you cut copper.</strong>
    Pin numbers here are a starting point for reading and planning. Confirm every one against the
    part datasheet, or against your own CubeMX pinout export for the G431, before committing to a layout.
    Every field below is editable and your edits persist.</div>
  <div id="pkgs"></div>
  <div class="panel"><h3>Polarity — the parts that care which way round they go</h3><div id="pol"></div></div>`;

  const c=$('#pkgs',el);
  PKGS.forEach(p=>{
    const d=document.createElement('div'); d.className='panel';
    let gfx='';
    if(p.type==='quad') gfx=svgQuad(p);
    else if(p.type==='dual') gfx=svgDual(p,false);
    else if(p.type==='dual3') gfx=svgDual(p,true);
    else if(p.type==='module') gfx=svgModule(p);
    else gfx=svgConn(p);
    d.innerHTML=`<h3>${esc(p.n)} <span class="chip">${esc(p.pkg)}</span></h3>
      <div class="pkg"><div>${gfx}</div><div>
        ${pinTable(p)}
        <div style="font-size:12.5px;color:var(--graphite);margin-top:10px">${esc(p.note)}</div>
        ${p.warn?'<div class="fail" style="margin-top:10px">'+esc(p.warn)+'</div>':''}
      </div></div>`;
    d.querySelectorAll('input').forEach(inp=>{
      inp.oninput=()=>setPin(inp.dataset.k, isNaN(+inp.dataset.i)?inp.dataset.i:+inp.dataset.i, inp.dataset.f, inp.value);
      inp.onblur=()=>{ logDebounced('action','Edited pin assignment on '+p.n); renderPin(); };
    });
    c.appendChild(d);
  });

  $('#pol',el).innerHTML=POLAR.map(x=>`<div class="polrow">${svgPolarity(x.k)}
    <div><div class="pt">${esc(x.t)}</div><div class="pd">${esc(x.d)}</div></div></div>`).join('');
}



/* =====================================================================
   SCHEMATICS — drawn circuit blocks with editable net labels
   ===================================================================== */
function nlab(sid,nid,def){ const o=(S.nets||{})[sid]||{}; return (o[nid]!==undefined&&o[nid]!=='')?o[nid]:def; }
function setNet(sid,nid,v){ S.nets=S.nets||{}; S.nets[sid]=S.nets[sid]||{}; S.nets[sid][nid]=v; save(); }

/* --- primitives --- */
const SW='#15171B', SB='#1B4B8F', SR='#A32D2D', SG='#5A6170';
const W=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c||SW}" stroke-width="1.6"/>`;
const P=(d,c)=>`<path d="${d}" fill="none" stroke="${c||SW}" stroke-width="1.6"/>`;
const J=(x,y)=>`<circle cx="${x}" cy="${y}" r="3" fill="${SW}"/>`;
const T=(x,y,t,a,sz,c)=>`<text x="${x}" y="${y}" text-anchor="${a||'start'}" font-size="${sz||10}" fill="${c||SG}">${esc(t)}</text>`;
const TB=(x,y,t,a,sz,c)=>`<text x="${x}" y="${y}" text-anchor="${a||'start'}" font-size="${sz||10.5}" font-weight="600" fill="${c||SW}">${esc(t)}</text>`;
function GND(x,y){return W(x,y,x,y+9)+P(`M${x-8} ${y+9} H${x+8} M${x-5} ${y+13} H${x+5} M${x-2} ${y+17} H${x+2}`);}
function RAIL(x,y,t){return W(x,y,x,y-10)+P(`M${x-7} ${y-10} L${x} ${y-17} L${x+7} ${y-10}`,SR)+T(x,y-21,t,'middle',9.5,SR);}
function RES(x,y,h,lab,val){ // h=true horizontal
  const b=h?`<rect x="${x-14}" y="${y-6}" width="28" height="12" fill="#FBFBF9" stroke="${SW}" stroke-width="1.4"/>`
           :`<rect x="${x-6}" y="${y-14}" width="12" height="28" fill="#FBFBF9" stroke="${SW}" stroke-width="1.4"/>`;
  return b+(h?T(x,y-11,val,'middle',9.5,SB)+T(x,y+19,lab,'middle',9,SG)
             :T(x+11,y-3,val,'start',9.5,SB)+T(x+11,y+8,lab,'start',9,SG));
}
function CAP(x,y,polar,val){ // vertical, pin at top and bottom
  let s=W(x,y-14,x,y-5)+P(`M${x-10} ${y-5} H${x+10}`);
  s+= polar? P(`M${x-10} ${y+3} A 10 6 0 0 0 ${x+10} ${y+3}`) : P(`M${x-10} ${y+3} H${x+10}`);
  s+= W(x,y+5,x,y+14);
  if(polar) s+=T(x-13,y-8,'+','end',11,SR);
  return s+T(x+13,y,val,'start',9.5,SB);
}
function CHIP(x,y,w,h,name,sub){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#2C2E33" stroke="${SW}"/>`
   +`<circle cx="${x+9}" cy="${y+9}" r="3.5" fill="none" stroke="#EFEEE9"/>`
   +`<text x="${x+w/2}" y="${y+h/2+(sub?-2:4)}" text-anchor="middle" font-size="11" font-weight="600" fill="#EFEEE9">${esc(name)}</text>`
   +(sub?`<text x="${x+w/2}" y="${y+h/2+12}" text-anchor="middle" font-size="9" fill="#9BA1AC">${esc(sub)}</text>`:'');
}
function BOX(x,y,w,h,name,sub,col){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="#FBFBF9" stroke="${col||SW}" stroke-width="1.5"/>`
   +`<text x="${x+w/2}" y="${y+h/2+(sub?-2:4)}" text-anchor="middle" font-size="11" font-weight="600" fill="${SW}">${esc(name)}</text>`
   +(sub?`<text x="${x+w/2}" y="${y+h/2+12}" text-anchor="middle" font-size="9" fill="${SG}">${esc(sub)}</text>`:'');
}
function NET(sid,nid,x,y,def,a){ return `<text x="${x}" y="${y}" text-anchor="${a||'start'}" font-size="10" font-weight="600" fill="${SB}">${esc(nlab(sid,nid,def))}</text>`; }
function MOSN(x,y){ // n-channel, gate left
  return W(x-22,y,x-8,y)+P(`M${x-8} ${y-13} V${y+13}`)+P(`M${x-3} ${y-13} V${y-4} M${x-3} ${y-4} V${y+4} M${x-3} ${y+4} V${y+13}`)
   +W(x-3,y-9,x+16,y-9)+W(x+16,y-9,x+16,y-22)+W(x-3,y+9,x+16,y+9)+W(x+16,y+9,x+16,y+22)
   +W(x-3,y,x+16,y)+P(`M${x+8} ${y-4} L${x+13} ${y} L${x+8} ${y+4} Z`,SW);
}
function LEDS(x,y){
  return W(x,y-14,x,y-6)+P(`M${x-8} ${y-6} L${x+8} ${y-6} L${x} ${y+5} Z`)+P(`M${x-8} ${y+5} H${x+8}`)
   +P(`M${x+9} ${y-9} l5 -5 M${x+11} ${y-4} l5 -5`,SR)+W(x,y+5,x,y+14);
}

function renderSchem(){
  const el=$('#t-schem');
  const mode=S.schemView||'schematic';
  el.innerHTML=`
  <div class="panel" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <div style="display:flex;border:1px solid var(--rule)">
      ${[['schematic','Schematic'],['wiring','As it really looks'],['physical','Board layout']].map(x=>
      `<button class="act" data-v="${x[0]}" style="border:0;border-right:1px solid var(--rule);
        background:${mode===x[0]?'var(--bluep)':'#fff'};font-weight:${mode===x[0]?600:400}">${x[1]}</button>`).join('')}
    </div>
    <span style="font-size:12.5px;color:var(--graphite)">
      ${mode==='schematic'
        ? 'Symbols and nets — how the circuit works. Every label is editable.'
        : mode==='wiring'
        ? 'Real packages, numbered pins, wires drawn between them. This is the one to have open while soldering.'
        : 'Where each part physically sits on the board and in the robot.'}
    </span>
  </div>
  <div id="scb"></div>`;
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.schemView=b.dataset.v;save();renderSchem();});
  const c=$('#scb',el);

  if(mode==='wiring'){
    ['Actuator','Main brain','Display head'].forEach(g=>{
      const list=WIRES.filter(x=>x.g===g); if(!list.length) return;
      const h=document.createElement('div'); h.className='stage-head';
      h.innerHTML=`<h3>${esc(g)}</h3><span class="mono" style="font-size:12.5px;color:var(--graphite)">${list.length}</span>`;
      c.appendChild(h);
      list.forEach(p=>{
        const d=document.createElement('div'); d.className='panel';
        d.innerHTML=`<h3>${esc(p.n)}</h3>
          <div style="font-size:13.5px;max-width:78ch;margin-bottom:10px">${esc(p.why)}</div>
          <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px">
            ${p.legend.map(l=>`<span style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--graphite)">
              <span style="width:18px;height:3px;background:${WC[l[0]]||l[0]};display:inline-block"></span>${esc(l[1])}</span>`).join('')}
          </div>
          <div style="overflow-x:auto"><svg viewBox="0 0 ${p.w} ${p.h}" width="100%" style="min-width:760px">${p.draw()}</svg></div>`;
        c.appendChild(d);
      });
    });
    return;
  }

  if(mode==='physical'){
    const SUB={nodecu:'Actuator',nodepl:'Actuator',act:'Mechanics',base:'Main brain',head:'Display head'};
    ['Actuator','Mechanics','Main brain','Display head'].forEach(g=>{
      const list=PHYS.filter(p=>SUB[p.id]===g);
      if(!list.length) return;
      const h=document.createElement('div'); h.className='stage-head';
      h.innerHTML=`<h3>${esc(g)}</h3>`;
      c.appendChild(h);
      list.forEach(p=>{
        const d=document.createElement('div'); d.className='panel';
        d.innerHTML=`<h3>${esc(p.n)} <span class="chip">${esc(p.sub)}</span></h3>
          <div style="font-size:13.5px;max-width:78ch;margin-bottom:12px">${esc(p.why)}</div>
          <div style="overflow-x:auto"><svg viewBox="0 0 ${p.w} ${p.h}" width="100%" style="min-width:520px">${p.draw()}</svg></div>`;
        c.appendChild(d);
      });
    });
    return;
  }

  const SUBS={sense:'Actuator',drive:'Actuator',enc:'Actuator',adc:'Actuator',
              power:'Main brain',can:'Main brain',kill:'Main brain',head:'Display head'};
  ['Actuator','Main brain','Display head'].forEach(g=>{
    const list=SCHEMS.filter(x=>SUBS[x.id]===g);
    if(!list.length) return;
    const h=document.createElement('div'); h.className='stage-head';
    h.innerHTML=`<h3>${esc(g)}</h3><span class="mono" style="font-size:12.5px;color:var(--graphite)">${list.length}</span>`;
    c.appendChild(h);
    list.forEach(sc=>{
      const d=document.createElement('div'); d.className='panel';
      d.innerHTML=`<h3>${esc(sc.n)}</h3>
        <div style="font-size:13.5px;max-width:78ch;margin-bottom:12px">${esc(sc.why)}</div>
        <div style="overflow-x:auto"><svg viewBox="0 0 ${sc.w} ${sc.h}" width="100%" style="min-width:560px">${sc.draw(sc.id)}</svg></div>
        <div class="fail" style="margin-top:10px">${esc(sc.warn)}</div>
        <div style="margin-top:12px">
          <div style="font-size:12px;color:var(--graphite);font-weight:600;margin-bottom:6px">Net labels</div>
          <div class="grid g3">${sc.nets.map(n=>`<div class="field" style="margin-bottom:6px">
            <input type="text" data-s="${sc.id}" data-n="${n[0]}" value="${esc(nlab(sc.id,n[0],n[1]))}">
          </div>`).join('')}</div></div>`;
      d.querySelectorAll('input').forEach(inp=>{
        inp.oninput=()=>setNet(inp.dataset.s,inp.dataset.n,inp.value);
        inp.onblur=()=>{ logDebounced('action','Edited net labels on the '+sc.n.toLowerCase()+' schematic'); renderSchem(); };
      });
      c.appendChild(d);
    });
  });
}
